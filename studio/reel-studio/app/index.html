<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBB Studio</title>
<link rel="stylesheet" href="editor/editor.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8508b'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
<div id="app"><div class="boot">Starting…</div></div>
<script>
/* Opened straight from the folder (file://), the app cannot run: browsers block modules and models there,
   and nothing would ever start (the owner's first try, 16 Nov). Say what to do instead. */
if (location.protocol === 'file:') {
  document.getElementById('app').innerHTML = '<div class="boot" style="max-width:520px;margin:18vh auto;text-align:center;line-height:1.6;color:#ddd;font:16px/1.6 -apple-system,system-ui,sans-serif">'
    + '<h2 style="margin:0 0 12px;color:#fff">Open KBB Studio with its launcher</h2>'
    + 'Close this tab. In the <b>KBB Studio</b> folder, <b>right-click “Start KBB Studio”</b> → <b>Open</b> → <b>Open</b> (first time only; after that a double-click is enough).<br><br>'
    + 'A small Terminal window opens — keep it open — and KBB Studio starts in Chrome by itself.</div>';
}
</script>
<script type="module" src="editor/main.js"></script>
</body>
</html>
