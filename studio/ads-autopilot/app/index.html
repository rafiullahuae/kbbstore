<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBB Ads Autopilot</title>
<link rel="preload" href="vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233f7d5c'/%3E%3Cpath d='M9 22l7-12 7 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true">K</span><b>Ads Autopilot</b></div>
    <label class="search" id="search-box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="search" type="search" autocomplete="off"><kbd>⌘K</kbd></label>
    <div class="seg" id="range" role="tablist"></div>
    <button class="cc-btn top" id="cc-top" type="button"></button>
    <span class="spacer"></span>
    <div class="acct" id="acct"></div>
    <div class="seg" id="lang" role="tablist"><button type="button" data-l="en">EN</button><button type="button" data-l="ar">عربي</button></div>
    <div class="seg mode" id="mode" role="tablist"></div>
    <button class="stop" id="kill" type="button"></button>
    <div class="warm" id="warm" role="status" aria-live="polite" hidden></div>
  </header>
  <aside class="nav" aria-label="Main" id="nav"></aside>
  <main id="view" tabindex="-1"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>
