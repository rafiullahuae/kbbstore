@font-face{font-family:Outfit;src:url(outfit-latin.woff2) format("woff2");font-weight:300 800;font-display:swap}
@font-face{font-family:Cairo;src:url(cairo-arabic.woff2) format("woff2");font-weight:300 800;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}

.drow>*{min-width:0}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dhead .tag{font-weight:800;color:var(--pink);font-size:12.5px;letter-spacing:.08em}
.dhead b{font-size:17px}.dhead p{margin:0;color:var(--muted);font-size:13px}
.frame{width:var(--fw,100%);max-width:100%;container-type:inline-size;border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:#fff}
.frame>section{padding:30px 22px}
@container (max-width:600px){.frame>section{padding:22px 14px}}
.hd{text-align:center;display:grid;gap:4px;margin-bottom:20px;justify-items:center}
.hd .ey{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
.hd h3{margin:0;font-size:clamp(22px,4.2cqi,30px);font-weight:800;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}

.cta{display:block;margin:20px auto 0;width:max-content;max-width:100%;border:0;border-radius:999px;padding:11px 26px;font-weight:700;font-size:14px;background:var(--ink);color:#fff}

.pics{display:flex;flex-wrap:wrap;gap:5px}

.fg .va.hide{display:block;margin:4px 0 2px}

    homeT:'قسم الصفحة الرئيسية · 6 خيارات', homeP:'كل خيار قسم واحد بسيط: كل فئة مع نصها وأسماء المنتجات.', yourGifts:'هداياكِ المجانية',
    cPanel:'نافذة السلة', cPage:'صفحة السلة', cSum:'الدفع · الملخص',
    yourBag:'حقيبتك', bag:'حقيبة التسوق', summary:'ملخص الطلب', items:n => n === 1 ? 'منتج واحد' : n === 2 ? 'منتجان' : n + ' منتجات', empty:'حقيبتك فارغة.',
    sub:'المجموع الفرعي', giftsLine:n => `هدايا مجانية (${n})`, deliv:'التوصيل', freeDel:'مجاني', total:'الإجمالي', checkout:'إتمام الشراء', placeOrder:'تأكيد الطلب',
    head:'هدايا مجانية لكِ', free:'مجاناً', viewAll:'عرض الكل', hide:'إخفاء', worth:v => `بقيمة ${v}`,
    ey:'هدايا مجانية', hpTitle:'هدايا مجانية مع كل طلب', hpSub:'كلما تسوّقتِ أكثر، أضفنا لكِ أكثر، مجاناً.', shop:'تسوّقي الآن', spend:'أنفقي', yours:'حقيبتك', giftsWord:'هدية مجانية', upto:n => `حتى <em>${n} هدية مجانية</em> مع طلبك`, showAll:'عرض الكل', hideAll:'إخفاء', receipt:'هداياكِ المجانية', receiptSub:'تسوّقي أكثر، واحصلي على أكثر', totalFree:'الإجمالي', freeWord:'مجاناً',
    status:(sub, r) => `الحقيبة <b>${sub}</b> · ${r ? `الفئة <b>${r}</b>` : 'لا هدية بعد'}`, money:v => v.toLocaleString('en-US') + ' د.إ'},
};
const PRESETS = [{}, {wrap:1}, {wrap:1, aqua:1, serum:2}, {wrap:1, aqua:2, cream:2, serum:1}, {wrap:2, aqua:3, cream:4, serum:2}, {wrap:4, aqua:5, cream:6, serum:6}];
const S = {lang:'en', bag:{wrap:1, aqua:2, cream:2, serum:1}, last:-1, fw:'desk', val:false, open:{}};

const L = () => T[S.lang];
const AR = () => S.lang === 'ar';
const sumOf = b => Object.entries(b).reduce((a, [k, q]) => a + PRODUCTS[k].p * q, 0);
const rangeIx = sub => RANGES.findIndex(r => sub >= r.min && (r.max == null || sub <= r.max));
const words = r => AR() ? r.ar : r.en;
const giftCount = r => r.gifts.reduce((a, g) => a + g[1], 0);
const giftValue = r => r.gifts.reduce((a, [k, q]) => a + G[k].v * q, 0);
const num = v => v.toLocaleString('en-US');
const amt = r => r.max == null ? (AR() ? `${num(r.min)}+ د.إ` : `AED ${num(r.min)}+`) : (AR() ? `${num(r.min)} – ${num(r.max)} د.إ` : `AED ${num(r.min)} – ${num(r.max)}`);
const amtShort = r => r.max == null ? `${num(r.min)}+` : num(r.min);
const gname = k => AR() ? G[k].na : G[k].n;
const gbrand = k => AR() ? G[k].ba : G[k].b;
const tile = (k, q) => `<span class="t" title="${esc(gname(k))}">${G[k].img ? `<img src="img/${G[k].img}.webp" alt="${esc(gname(k))}" loading="lazy">` : `<span class="ph0" role="img" aria-label="${esc(gname(k))}">${G[k].ini}</span>`}${q > 1 ? `<b>×${q}</b>` : ''}</span>`;
const pics = (r, max = 9) => `<div class="pics">${r.gifts.slice(0, max).map(([k, q]) => tile(k, q)).join('')}</div>`;
const you = (i, ix) => i === ix ? ` <span class="you">${L().yours}</span>` : '';

/* gift box B (final): photos + View all; View all opens the full list */
function box(where, ix, anim){
  if (ix < 0) return '';
  const r = RANGES[ix], lang = L(), open = !!S.open[where];
  const rows = r.gifts.map(([k, q]) => `<div class="gi">${tile(k, 1)}<div class="gn"><small>${esc(gbrand(k))}</small>${q > 1 ? `<em>${q}× </em>` : ''}${esc(gname(k))}</div>${S.val ? `<span class="was">${lang.money(G[k].v * q)}</span>` : ''}<span class="free">${lang.free}</span></div>`).join('');
  const photos = `<div class="th">${r.gifts.map(([k, q]) => tile(k, q)).join('')}<button type="button" class="va" data-act="open" data-v="${where}" aria-expanded="false">${lang.viewAll}</button></div>`;
  return `<div class="fg${anim ? ' pop' : ''}"><div class="h">${GIFT}<span>${lang.head}</span>${S.val ? `<span class="ov">${lang.worth(lang.money(giftValue(r)))}</span>` : ''}</div>${open ? `${rows}<button type="button" class="va hide" data-act="open" data-v="${where}" aria-expanded="true">${lang.hide}</button>` : photos}</div>`;
}
function items(){
  const ks = Object.keys(S.bag).filter(k => S.bag[k] > 0);
  if (!ks.length) return `<div class="empty">${L().empty}</div>`;
  return ks.map(k => { const p = PRODUCTS[k], q = S.bag[k]; return `<div class="item"><img src="img/${p.img}.webp" alt="" loading="lazy"><div class="n"><small>${esc(AR() ? p.ba : p.b)}</small>${esc(AR() ? p.na : p.n)}${q > 1 ? ` <em>× ${q}</em>` : ''}</div><div class="p">${L().money(p.p * q)}</div></div>`; }).join('');
}

/* the homepage section: one simple, informative section, in six treatments */
const HOME = [
  ['Simple list','One white card, a row per range: amount, wording, product names, small photos.'],
  ['Intro beside the list','The title and button on the left, the same list on the right. Shorter on a computer.'],
  ['Table','A real table: “Spend” and “Your free gifts” headings, light stripes. The most informative.'],
  ['Tap to open','Each range is one line; tap it to see the product names and photos. The first one starts open. The shortest.'],
  ['Comparison chart','One box split into five columns, a range in each, products listed underneath. Rows on a phone.'],
  ['Plain text','No card at all: centred lines with thin dividers and product names in grey. The lightest.'],
];
const names = r => r.gifts.map(([k, q]) => `${q > 1 ? q + '× ' : ''}${gbrand(k) ? esc(gbrand(k)) + ' ' : ''}${esc(gname(k))}`);
function homeSection(v){
  const lang = L(), hd = `<div class="hd"><span class="ey">${lang.ey}</span><h3>${lang.hpTitle}</h3><p>${lang.hpSub}</p></div>`, cta = `<button type="button" class="cta">${lang.shop}</button>`;
  const rows = RANGES.map(r => `<div class="tr"><div class="ra">${esc(amt(r))}</div><div class="tw"><b>${esc(words(r))}</b><span>${names(r).join(' · ')}</span></div>${pics(r)}</div>`).join('');
  if (v === 0) return `<section class="hs">${hd}<div class="tl">${rows}</div>${cta}</section>`;
  if (v === 1) return `<section class="hs h2s"><div class="intro"><span class="ey">${lang.ey}</span><h3>${lang.hpTitle}</h3><p>${lang.hpSub}</p>${cta}</div><div class="tl">${rows}</div></section>`;
  if (v === 2) return `<section class="hs h3s">${hd}<div class="tbw"><table><thead><tr><th scope="col">${lang.spend}</th><th scope="col">${lang.yourGifts}</th></tr></thead><tbody>${RANGES.map(r => `<tr><th scope="row">${esc(amt(r))}</th><td><b>${esc(words(r))}</b><span>${names(r).join(' · ')}</span></td></tr>`).join('')}</tbody></table></div>${cta}</section>`;
  if (v === 3) return `<section class="hs h4s">${hd}<div class="acc">${RANGES.map((r, i) => `<details${i === 0 ? ' open' : ''}><summary><span class="ra">${esc(amt(r))}</span><b>${esc(words(r))}</b><i aria-hidden="true"></i></summary><div class="in"><ul>${names(r).map(n => `<li>${n}</li>`).join('')}</ul>${pics(r)}</div></details>`).join('')}</div>${cta}</section>`;
  if (v === 4) return `<section class="hs h5s">${hd}<div class="cmp">${RANGES.map(r => `<div class="col"><div class="ra">${esc(amt(r))}</div><b>${esc(words(r))}</b><ul>${names(r).map(n => `<li>${n}</li>`).join('')}</ul></div>`).join('')}</div>${cta}</section>`;
  return `<section class="hs h6s">${hd}<div class="pl">${RANGES.map(r => `<div class="ln"><div><span class="ra">${esc(amt(r))}</span> <b>${esc(words(r))}</b></div><span>${names(r).join(' · ')}</span></div>`).join('')}</div>${cta}</section>`;
}

function render(){
  const lang = L(), sub = sumOf(S.bag), ix = rangeIx(sub), anim = ix !== S.last && ix >= 0;
  S.last = ix;
  document.documentElement.lang = S.lang; document.documentElement.dir = AR() ? 'rtl' : 'ltr';
  document.body.classList.toggle('rtl', AR());
  document.querySelectorAll('[data-t]').forEach(el => { const v = lang[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  const seg = (id, opts, cur, act) => { document.getElementById(id).innerHTML = opts.map(([v, l]) => `<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${String(v) === String(cur)}">${l}</button>`).join(''); };
  seg('segJump', PRESETS.map((b, i) => [i, lang.money(sumOf(b))]), PRESETS.findIndex(b => JSON.stringify(b) === JSON.stringify(S.bag)), 'jump');
  seg('segLang', [['en','English'],['ar','العربية']], S.lang, 'lang');
  seg('segW', [['desk', lang.desk], ['phone', lang.phone]], S.fw, 'fw');
  seg('segV', [[0, lang.off], [1, lang.on]], S.val ? 1 : 0, 'val');
  document.getElementById('status').innerHTML = lang.status(lang.money(sub), ix >= 0 ? esc(amt(RANGES[ix])) : '');
  const n = Object.values(S.bag).reduce((a, b) => a + b, 0), gn = ix >= 0 ? giftCount(RANGES[ix]) : 0, it = items();
  let h = `<div class="secT"><h2>${lang.boxT}</h2><p>${lang.boxP}</p></div><div class="trio">
    <div><div class="cap">${lang.cPanel}</div><div class="surf panel" style="max-width:400px"><div class="ph">${lang.yourBag}<small>${lang.items(n)}</small></div>${it}${box('panel', ix, anim)}<div class="tot"><span>${lang.sub}</span><span>${lang.money(sub)}</span></div><div class="btn">${lang.checkout}</div></div></div>
    <div><div class="cap">${lang.cPage}</div><div class="surf"><div class="ph">${lang.bag}<small>${lang.items(n)}</small></div>${it}${box('page', ix, anim)}<div class="tot"><span>${lang.sub}</span><span>${lang.money(sub)}</span></div><div class="btn" style="max-width:240px;margin-inline-start:auto">${lang.checkout}</div></div></div>
    <div><div class="cap">${lang.cSum}</div><div class="surf sum"><div class="ph">${lang.summary}</div>${it}${box('sum', ix, anim)}<div class="tline"><span>${lang.sub}</span><b>${lang.money(sub)}</b></div>${gn ? `<div class="tline"><span>${lang.giftsLine(gn)}</span><b class="g">${lang.money(0)}</b></div>` : ''}<div class="tline"><span>${lang.deliv}</span><b>${lang.freeDel}</b></div><div class="tot"><span>${lang.total}</span><span>${lang.money(sub)}</span></div><div class="btn">${lang.placeOrder}</div></div></div></div>`;
  h += `<div class="secT"><h2>${lang.homeT}</h2><p>${lang.homeP}</p></div>`;
  h += HOME.map(([name, desc], i) => `<div class="drow"><div class="dhead"><span class="tag">${String(i + 1).padStart(2, '0')}</span><b>${esc(name)}</b><p>${esc(desc)}</p></div><div class="frame" style="--fw:${S.fw === 'phone' ? '390px' : '100%'}">${homeSection(i)}</div></div>`).join('');
  document.getElementById('board').innerHTML = h;
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const a = btn.dataset.act, v = btn.dataset.v;
  if (a === 'jump') S.bag = JSON.parse(JSON.stringify(PRESETS[+v]));
  else if (a === 'lang') S.lang = v;
  else if (a === 'fw') S.fw = v;
  else if (a === 'val') S.val = v === '1';
  else if (a === 'open') S.open[v] = !S.open[v];
  else return;
  render();
});
render();
</script>
