<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Points and Credit Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#C6395F;--pink2:#E0567A;--blush:#FFF0F4;--blush2:#fde6ee;--green:#2e8f62;--mint:#EEF7F2;--ink:#221A20;--ink2:#4a3f46;--mute:#756C74;--line:#ece3e7;--bg:#f7f1f4;--card:#fff;--gold:#c99a2e;--gold2:#fff6e2;
--a-bg:#f5f6fb;--a-card:#fff;--a-line:#e6e8f0;--a-ink:#1d2433;--a-soft:#626c80;--a-accent:#16a34a;--a-accent-soft:#e7f7ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1619}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#221A20;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top b{font-size:15px;margin-right:6px;white-space:nowrap}
.top .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.top .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin:0 2px 0 8px}
.top button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600}
.top button[aria-pressed="true"]{background:#fff;color:#221A20}
.note{max-width:1100px;margin:14px auto 0;padding:0 16px;font-size:13px;color:var(--mute)}
.stage{display:flex;justify-content:center;padding:18px 16px 60px}
.frame{width:100%;max-width:1180px}
.frame.phone{max-width:390px}
.phone .shell{border-radius:28px;box-shadow:0 30px 70px rgba(34,26,32,.18);overflow:hidden;background:#fff}
/* --- shop chrome --- */
.shop{background:linear-gradient(180deg,#fff,#fff8fa);min-height:640px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em;font-size:17px;white-space:nowrap}
.phone .logo{font-size:14px}.phone .hico{gap:9px;font-size:12px}.phone .ptschip{font-size:11.5px;padding:4px 8px}
.logo i{width:28px;height:22px;display:inline-block;background:radial-gradient(circle at 50% 70%,var(--pink) 0 30%,transparent 31%),conic-gradient(from 200deg at 50% 80%,transparent 0 10deg,var(--pink2) 10deg 40deg,transparent 40deg 70deg,var(--pink) 70deg 100deg,transparent 100deg);border-radius:50%}
.logo span{color:var(--pink)}
.hico{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--ink2)}
.ptschip{display:inline-flex;align-items:center;gap:6px;background:var(--gold2);color:#7a5a12;border:1px solid #f0dfb3;border-radius:999px;padding:5px 10px;font-weight:700;font-size:12.5px}
.ptschip svg{width:14px;height:14px}
.wrap{max-width:1100px;margin:0 auto;padding:22px}
.phone .wrap{padding:16px}
.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:28px}
.phone .grid2{grid-template-columns:1fr;gap:16px}
.pimg{aspect-ratio:1;border-radius:18px;background:linear-gradient(135deg,#fdf1f5,#fff);display:grid;place-items:center;border:1px solid var(--line)}
.tube{width:38%;height:62%;border-radius:12px 12px 30px 30px;background:linear-gradient(90deg,#f4f4f6,#fff 40%,#e9e9ee);position:relative;box-shadow:0 18px 30px rgba(0,0,0,.08)}
.tube:after{content:"";position:absolute;bottom:-14%;left:30%;width:40%;height:16%;background:#b3242c;border-radius:4px 4px 10px 10px}
.tube b{position:absolute;left:12%;top:20%;font-size:11px;color:#b3242c;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.05em}
.brand{display:inline-block;background:var(--blush);color:var(--pink);font-weight:700;font-size:12px;border-radius:6px;padding:3px 8px}
h1{font-size:28px;line-height:1.2;margin:10px 0 8px}
.phone h1{font-size:22px}
.price{font-size:26px;font-weight:800;margin:6px 0 12px}
.earn{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--gold2),#fffaf0);border:1px solid #f1e2bd;border-radius:14px;padding:11px 13px;margin:6px 0 14px}
.earn .coin{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe59a,#e3b13b 60%,#b98516);display:grid;place-items:center;color:#5c3f00;font-weight:800;font-size:13px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.earn b{color:#6b4c0c}
.earn small{display:block;color:#8a7552;font-size:12px}
.btn{border:0;border-radius:14px;background:var(--pink);color:#fff;font-weight:700;padding:14px 18px;font-size:15px}
.btn.green{background:var(--green)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
/* cart drawer */
.drawer{max-width:430px;margin-left:auto;background:#fff;min-height:640px;border-left:1px solid var(--line);box-shadow:-20px 0 40px rgba(0,0,0,.06)}
.phone .drawer{max-width:none;border:0;box-shadow:none}
.dtabs{display:flex;gap:18px;padding:16px 18px 0;border-bottom:1px solid var(--line);font-weight:700;color:var(--mute)}
.dtabs span{padding-bottom:10px}.dtabs .on{color:var(--pink);border-bottom:2px solid var(--pink)}
.line{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.thumb{width:62px;height:62px;border-radius:12px;background:linear-gradient(135deg,#fdf1f5,#fff);border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;color:var(--mute)}
.tot{padding:14px 18px;display:grid;gap:8px;font-size:14px}
.tot div{display:flex;justify-content:space-between}
.tot .g{font-size:17px;font-weight:800}
.tot .pts{color:var(--green);font-weight:700}
/* checkout */
.co{display:grid;grid-template-columns:1.2fr .9fr;gap:22px}
.phone .co{grid-template-columns:1fr}
.fld{display:grid;gap:5px;margin-bottom:10px;font-size:13px}
.fld input,.fld select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}
.redeem{border:2px solid #f0dfb3;background:linear-gradient(180deg,#fffaf0,#fff);border-radius:16px;padding:14px;margin:4px 0 14px}
.redeem h4{margin:0;display:flex;align-items:center;gap:8px;font-size:15px}
.switch{position:relative;width:46px;height:26px;border-radius:999px;background:#d9cfd4;border:0;flex:none;transition:background .2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--green)}.switch[aria-checked="true"]:after{left:23px}
.range{width:100%;accent-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid #ecd9a9;background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:#7a5a12}
.chips button.on{background:#7a5a12;color:#fff;border-color:#7a5a12}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
/* thank you */
.ty{text-align:center;padding:40px 22px}
.burst{width:120px;height:120px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e3b13b 60%,#a8740e);display:grid;place-items:center;color:#4a3200;font-weight:800;font-size:30px;box-shadow:0 18px 40px rgba(201,154,46,.35),inset 0 -5px 0 rgba(0,0,0,.12)}
/* account */
.acc{display:grid;grid-template-columns:230px 1fr;gap:22px}
.phone .acc{grid-template-columns:1fr}
.anav{display:grid;gap:4px;align-content:start}
.anav a{padding:10px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px}
.anav a.on{background:var(--blush);color:var(--pink)}
.phone .anav{display:flex;overflow:auto;gap:6px}
.phone .anav a{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px}
.bal{border-radius:22px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#E0567A 0,#C6395F 40%,#8f2346 100%);position:relative;overflow:hidden}
.bal:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.bal .n{font-size:40px;font-weight:800;line-height:1.1}
.bal .v{opacity:.9;font-weight:600}
.bal .sub{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;opacity:.95}
.bal .sub b{display:block;font-size:16px}
.bal .acts{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.bal .acts button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;background:#fff;color:var(--pink)}
.bal .acts button.alt{background:rgba(255,255,255,.18);color:#fff}
.hist{display:grid}
.h{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.h:first-child{border-top:0}
.h .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800}
.h .ic.e{background:var(--mint);color:var(--green)}.h .ic.r{background:var(--blush);color:var(--pink)}.h .ic.t{background:#eef2ff;color:#3b4fd8}.h .ic.p{background:var(--gold2);color:#8a6410}.h .ic.x{background:#f2f2f4;color:#888}
.h .amt{margin-left:auto;font-weight:800;white-space:nowrap}
.plus{color:var(--green)}.minus{color:var(--pink)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.tag.pend{background:var(--gold2);color:#8a6410}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.phone .how{grid-template-columns:1fr}
.how div{background:var(--blush);border-radius:14px;padding:12px;font-size:13px}
.how b{display:block;font-size:14px;margin-bottom:3px}
/* transfer */
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:5px;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--pink)}
.found{display:flex;gap:10px;align-items:center;background:var(--mint);border:1px solid #cfe7da;border-radius:14px;padding:10px 12px;margin:6px 0 12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}
.big{font-size:34px;font-weight:800;text-align:center;border:0;width:100%;outline:0;background:transparent;color:var(--ink)}
.otp{display:flex;gap:8px;justify-content:center;margin:12px 0}
.otp input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:800;border:1px solid var(--line);border-radius:12px}
.err{color:#c0392b;font-size:12.5px;margin-top:4px}
/* email */
.mail{max-width:560px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.mail .mh{background:linear-gradient(135deg,#C6395F,#8f2346);color:#fff;padding:22px;text-align:center}
.mail .mb{padding:22px;font-size:14px;line-height:1.6}
/* admin */
.admin{display:grid;grid-template-columns:230px 1fr;min-height:700px;background:var(--a-bg);color:var(--a-ink)}
.phone .admin{grid-template-columns:1fr}
.aside{background:#fff;border-right:1px solid var(--a-line);padding:16px 12px}
.phone .aside{display:none}
.aside .k{display:flex;gap:8px;align-items:center;font-weight:800;margin-bottom:16px}
.aside .k i{width:30px;height:30px;border-radius:9px;background:#16a34a;color:#fff;display:grid;place-items:center;font-style:normal}
.aside a{display:block;padding:8px 10px;border-radius:9px;color:var(--a-soft);font-size:13.5px;text-decoration:none}
.aside a.on{background:var(--a-accent-soft);color:#0b6e3a;font-weight:700}
.aside .g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9aa3b5;margin:12px 10px 4px}
.amain{padding:20px}
.phone .amain{padding:14px}
.ah{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ah h2{margin:0;font-size:22px}
.ah p{margin:2px 0 0;color:var(--a-soft);font-size:13px}
.atabs{display:flex;gap:2px;border-bottom:1px solid var(--a-line);margin-bottom:14px;overflow:auto}
.atabs button{border:0;background:none;padding:10px 12px;color:var(--a-soft);font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.atabs button.on{color:var(--a-ink);font-weight:700;border-color:#16a34a}
.acard{background:#fff;border:1px solid var(--a-line);border-radius:14px;padding:16px;margin-bottom:12px}
.acard h3{margin:0 0 4px;font-size:15px}
.acard p.s{margin:0 0 12px;color:var(--a-soft);font-size:12.5px}
.ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.af{display:grid;gap:5px;font-size:12.5px}
.af span{font-weight:600;color:#3b4456}
.af small{color:#8a93a6;font-size:11.5px}
.af input,.af select{font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--a-line);border-radius:10px;background:#fff;color:var(--a-ink)}
.inl{display:flex;align-items:center;gap:6px}
.inl input{width:100%}
.modes{display:inline-flex;border:1px solid var(--a-line);border-radius:12px;overflow:hidden}
.modes button{border:0;background:#fff;padding:9px 14px;font-weight:700;font-size:13px;color:var(--a-soft)}
.modes button.on.off{background:#f3f4f6;color:#333}.modes button.on.test{background:#fff4dc;color:#8a5a00}.modes button.on.live{background:#16a34a;color:#fff}
.calc{background:#f8fafc;border:1px dashed #cfd6e4;border-radius:12px;padding:12px;font-size:13px;display:grid;gap:6px}
.calc b{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--a-line);border-radius:12px;padding:12px 14px;border-top:3px solid var(--c)}
.tile span{font-size:12px;color:var(--a-soft)}.tile b{display:block;font-size:22px;margin-top:2px}.tile small{color:#8a93a6;font-size:11.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--a-line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--a-soft);font-weight:600}
.tw{overflow:auto}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.pill.g{background:#e7f7ee;color:#0b6e3a}.pill.p{background:#fdeceb;color:#b4231a}.pill.b{background:#eef2ff;color:#3b4fd8}.pill.y{background:#fff4dc;color:#8a5a00}.pill.x{background:#f2f2f4;color:#666}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}
.bars i{flex:1;background:linear-gradient(#16a34a,#7ad3a0);border-radius:4px 4px 0 0}
.bars i.r{background:linear-gradient(#C6395F,#f1a3b8)}
/* owner app */
.oa{background:linear-gradient(180deg,#fbeef2,#fff);min-height:700px;padding:16px}
.oah{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.oah h3{margin:0;font-size:22px}
.oacard{background:#fff;border-radius:20px;padding:4px 14px;box-shadow:0 8px 24px rgba(150,60,85,.08);margin-bottom:12px}
.oarow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #f2e6eb}
.oarow:first-child{border-top:0}
.oarow .ico{width:32px;height:32px;border-radius:10px;background:#f6edf1;display:grid;place-items:center;font-size:15px}
.oarow small{display:block;color:var(--mute);font-size:12px}
.oarow .chev{margin-left:auto;color:#bbb}
.oaher{border-radius:22px;padding:16px;color:#fff;background:linear-gradient(160deg,#a33a5c,#7d2a45);margin-bottom:12px}
.flow{display:grid;gap:10px}
.tag2{font-size:11px;background:#16a34a;color:#fff;border-radius:6px;padding:2px 6px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#221A20;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (max-width:760px){.grid2,.co,.acc,.admin{grid-template-columns:1fr}.aside{display:none}.how{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <b>Bliss Points + Store credit · preview</b>
  <div class="grp" id="scrBtns"></div>
  <div class="grp"><span class="lab">View</span><button data-v="desk" aria-pressed="true">Computer</button><button data-v="phone" aria-pressed="false">Phone</button></div>
</div>
<p class="note">A live preview, not built yet. Change the rules under <b>Admin · Points settings</b> and every shopper screen follows. Nothing here talks to the shop.</p>
<div class="stage"><div class="frame" id="frame"><div class="shell" id="app"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const S = {
  mode: 'live', earnPer: 1, value: 0.05, minRedeem: 100, maxPct: 50, award: 'delivered', expiry: 12,
  transfers: true, tMin: 50, tMaxDay: 2000, tAge: 7, otp: true, signup: 100, review: 0, birthday: 200,
  balance: 1240, pending: 238, expiring: 120, credit: 75, useCredit: false, creditOn: true,
  cartSubtotal: 238, delivery: 0, use: false, usePts: 0,
  tStep: 1, tTo: '', tFound: null, tAmt: 200, tErr: '', aTab: 'settings', scr: 'product', view: 'desk'
};
const SCREENS = [
  ['product', 'Product page'], ['cart', 'Bag panel'], ['checkout', 'Checkout'], ['thanks', 'Order placed'],
  ['account', 'My points'], ['transfer', 'Send points'], ['email', 'Emails'],
  ['admin', 'Admin · Points'], ['customer', 'Admin · Customer'], ['owner', 'Owner app']
];
const $ = (s, r) => (r || document).querySelector(s);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const aed = (n) => 'AED ' + (Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
const earnFor = (aedAmt) => Math.floor(aedAmt * S.earnPer);
const worth = (pts) => pts * S.value;
const COIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/></svg>';
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1800); }

/* the points a basket may use: whole dirhams, the minimum, the cap */
function redeemable() {
  const capAed = Math.floor(S.cartSubtotal * S.maxPct / 100);
  const capPts = Math.floor(capAed / S.value);
  let pts = Math.min(S.balance, capPts);
  pts = Math.floor(worth(pts)) / S.value; // whole dirhams only
  return S.balance < S.minRedeem ? 0 : Math.floor(pts);
}

function header() {
  return '<div class="shead"><div class="logo"><i></i>K-BEAUTY <span>BLISS</span></div><div class="hico">' +
    (S.mode === 'off' ? '' : '<span class="ptschip">' + COIN + fmt(S.balance) + ' pts' + (S.creditOn && S.credit ? ' · ' + aed(S.credit) : '') + '</span>') + '<span>♡</span><span>👤</span><span>🛍 1</span></div></div>';
}

function product() {
  const price = 119, e = earnFor(price);
  return header() + '<div class="wrap"><div class="grid2"><div class="pimg"><div class="tube"><b>RETINOL 0.1%</b></div></div><div>' +
    '<span class="brand">FRANKLY</span><h1>FRANKLY - Retinol 0.1% Cream</h1><div class="price">AED 119</div>' +
    (S.mode === 'off' ? '' : '<div class="earn"><span class="coin">+' + (e > 999 ? '1k' : e) + '</span><div><b>Earn ' + fmt(e) + ' Bliss Points</b> with this product<small>Worth ' + aed(worth(e)) + ' on your next order · ' + (S.award === 'delivered' ? 'ready once it is delivered' : 'ready once it is paid') + '</small></div></div>') +
    '<p class="muted" style="font-size:14px;line-height:1.6">This vegan and cruelty-free cream is enriched with retinol, adenosine and ceramide NP to promote skin cell turnover and strengthen the skin barrier.</p>' +

function checkout() {

  const steps = [0.25, 0.5, 1].map((f) => Math.floor(worth(Math.floor(max * f))) / S.value).filter((v, i, a) => v > 0 && a.indexOf(v) === i);

    (S.creditOn && S.credit > 0 ? '<div class="redeem" style="border-color:#cfe7da;background:linear-gradient(180deg,#f3faf6,#fff)"><div class="row" style="justify-content:space-between"><h4><span style="width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--green);color:#fff;font-size:13px">AED</span>Use my store credit</h4>' +
      '<button class="switch" role="switch" aria-checked="' + S.useCredit + '" data-act="credit"></button></div>' +
      '<p class="hint" style="margin-top:4px">You have <b>' + aed(S.credit) + '</b> store credit' + (S.useCredit ? ' · <b>' + aed(cr) + '</b> used on this order, <b>' + aed(S.credit - cr) + '</b> left' : '') + '</p></div>' : '') +

    const rows = [['31 Oct 14:02', 'Layla Hassan', 'Earned', '+238', '#56231', 'On the way', 'y'], ['31 Oct 13:40', 'Noora Al Ketbi', 'Used', '−600', '#56229', '', 'p'], ['31 Oct 12:11', 'Layla → Mariam', 'Sent', '200', '', '“Happy birthday!”', 'b'], ['30 Oct 18:22', 'Fatima R.', 'Adjusted', '+500', '', 'Sorry for the delay — Rafi', 'x'], ['30 Oct 09:15', 'Aisha M.', 'Removed', '−119', '#56101', 'Order refunded', 'p'], ['29 Oct 23:59', '312 accounts', 'Expired', '−18,240', '', 'Older than 12 months', 'x']];
    inner = '<div class="acard"><div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px"><input placeholder="Search a customer, email or order" style="flex:1;min-width:200px;padding:9px 11px;border:1px solid var(--a-line);border-radius:10px;font:inherit"><select style="padding:9px;border:1px solid var(--a-line);border-radius:10px;font:inherit"><option>Everything</option><option>Earned</option><option>Used</option><option>Sent</option><option>Adjusted</option><option>Expired</option></select></div><div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Points</th><th>Order</th><th>Note</th></tr></thead><tbody>' + rows.map((r) => '<tr><td>' + r[0] + '</td><td><b>' + r[1] + '</b></td><td><span class="pill ' + r[6] + '">' + r[2] + '</span></td><td><b>' + r[3] + '</b></td><td>' + r[4] + '</td><td class="muted">' + r[5] + '</td></tr>').join('') + '</tbody></table></div><p class="hint">Every point is one line here, so a balance can always be explained. Export to CSV.</p></div>';
  } else if (t === 'credit') {
    inner = '<div class="tiles">' + [['#2e8f62', 'Credit given', 'AED 4,250', '63 customers'], ['#C6395F', 'Credit used', 'AED 2,980', 'on 51 orders'], ['#c99a2e', 'Still to be used', 'AED 1,270', 'your liability']].map((x) => '<div class="tile" style="--c:' + x[0] + '"><span>' + x[1] + '</span><b>' + x[2] + '</b><small>' + x[3] + '</small></div>').join('') + '</div>' +
      '<div class="acard"><h3>Give store credit</h3><p class="s">To any customer, by name, email or phone. Also on each customer’s page.</p><div class="ag"><label class="af"><span>Customer</span><input placeholder="Search name, email or phone" value="Layla Hassan · layla@example.ae"></label><label class="af"><span>Amount</span><div class="inl"><em style="font-style:normal;color:#8a93a6">AED</em><input type="number" value="50"></div><small>Whole dirhams.</small></label><label class="af"><span>Internal note <span class="pill x">team only</span></span><input placeholder="Why — never shown to the customer"></label><label class="af"><span>Message to the customer</span><input placeholder="Optional — shown in her account and email"></label></div><button class="btn sm green" style="margin-top:12px">Give credit</button></div>' +
      '<div class="acard"><h3>Credit activity</h3><div class="tw"><table><thead><tr><th>When</th><th>Customer</th><th>What</th><th>Amount</th><th>Internal note</th><th>By</th></tr></thead><tbody>' +
      [['30 Oct 18:22', 'Layla Hassan', 'Added', '+AED 75', 'Late delivery #56101', 'Rafi', 'g'], ['30 Oct 11:04', 'Noora Al Ketbi', 'Used', '−AED 40', 'Order #56190', '—', 'p'], ['29 Oct 15:30', 'Huda S.', 'Added', '+AED 120', 'Return #RT-88 refunded as credit', 'Sara', 'g'], ['28 Oct 09:12', 'Aisha M.', 'Removed', '−AED 20', 'Added twice by mistake', 'Rafi', 'x']].map((r) => '<tr><td>' + r[0] + '</td><td><b>' + r[1] + '</b></td><td><span class="pill ' + r[6] + '">' + r[2] + '</span></td><td><b>' + r[3] + '</b></td><td class="muted">' + r[4] + '</td><td>' + r[5] + '</td></tr>').join('') + '</tbody></table></div></div>';
  } else {
    inner = '<div class="acard"><h3>Sends</h3><p class="s">Every send between shoppers, with a hold if something looks unusual (many sends to one account, a new account, a big amount).</p><div class="tw"><table><thead><tr><th>When</th><th>From</th><th>To</th><th>Points</th><th>Status</th><th></th></tr></thead><tbody>' +
      [['31 Oct 12:11', 'Layla H.', 'Mariam A.', '200', 'Sent', 'g', ''], ['30 Oct 22:40', 'New account (2 days)', '—', '1,500', 'Refused: account too new', 'p', ''], ['30 Oct 16:05', 'Sara K.', 'Huda S.', '1,900', 'Held for review', 'y', '<button class="btn sm green">Release</button> <button class="btn sm ghost">Return</button>']].map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td><b>' + r[3] + '</b></td><td><span class="pill ' + r[5] + '">' + r[4] + '</span></td><td>' + r[6] + '</td></tr>').join('') + '</tbody></table></div></div>';
  }
  return adminShell('admin', '<div class="ah"><div><h2>Points & credit</h2><p>Growth & Marketing → Points & credit</p></div></div>' + tabs + inner);
}

function adminCustomer() {
  return adminShell('customer', '<div class="ah"><div><h2>Layla Hassan</h2><p>layla@example.ae · +971 50 123 4567 · 7 orders</p></div></div>' +
    '<div class="ag"><div class="acard"><h3>Bliss Points</h3><div style="font-size:30px;font-weight:800">' + fmt(S.balance) + ' <span style="font-size:14px;color:#8a93a6">(' + aed(worth(S.balance)) + ')</span></div><p class="s">' + fmt(S.pending) + ' on the way · ' + fmt(S.expiring) + ' expire 31 Dec</p>' +
    '<div class="af"><span>Add or remove points</span><div class="inl"><input id="adj" type="number" value="100"><button class="btn sm green" data-act="adj">Add</button><button class="btn sm ghost" data-act="adjm">Remove</button></div><input placeholder="Reason (shown in her history)" style="margin-top:6px"><small>Logged with your name. She gets an email.</small></div></div>' +
    '<div class="acard"><h3>Store credit</h3><div style="font-size:30px;font-weight:800">' + aed(S.credit) + '</div><p class="s">Money she can spend at checkout. Added by hand, in whole dirhams.</p>' +
    '<div class="af"><span>Amount</span><div class="inl"><em style="font-style:normal;color:#8a93a6">AED</em><input id="cr" type="number" value="50" min="1" step="1"><button class="btn sm green" data-act="cradd">Add credit</button><button class="btn sm ghost" data-act="crrem">Remove</button></div></div>' +
    '<div class="af" style="margin-top:8px"><span>Internal note <span class="pill x">team only</span></span><input placeholder="e.g. Order #56101 arrived damaged — agreed with her on WhatsApp"><small>Never shown to the customer. Kept with your name and the time.</small></div>' +
    '<div class="af" style="margin-top:8px"><span>Message to her (optional)</span><input placeholder="Sorry for the late delivery — enjoy AED 50 on us."><small>Shown in her account and in the email. Leave empty to add credit quietly.</small></div>' +
    '<div class="af" style="margin-top:8px"><span>Expires</span><select><option>Never</option><option>In 3 months</option><option>In 6 months</option><option>In 12 months</option></select></div>' +
    '<div class="tw" style="margin-top:10px"><table><tbody><tr><td>30 Oct</td><td><span class="pill g">Added</span></td><td>+AED 75</td><td class="muted">Late delivery #56101 — Rafi</td></tr><tr><td>14 Sep</td><td><span class="pill p">Used</span></td><td>−AED 40</td><td>#55870</td></tr></tbody></table></div></div>' +
    '<div class="acard"><h3>Points activity</h3><div class="tw"><table><tbody><tr><td>31 Oct</td><td><span class="pill y">Earned</span></td><td>+238</td><td>#56231</td></tr><tr><td>12 Oct</td><td><span class="pill g">Earned</span></td><td>+412</td><td>#56102</td></tr><tr><td>3 Oct</td><td><span class="pill p">Used</span></td><td>−400</td><td>#56044</td></tr><tr><td>28 Sep</td><td><span class="pill b">Sent</span></td><td>−200</td><td>to Mariam A.</td></tr></tbody></table></div></div></div>' +
    '<div class="acard"><h3>On each order</h3><p class="s">Order #56231 — Totals: Subtotal AED 238 · Points used −AED 0 · <b>Points earned +238 (on the way)</b>. A refund or cancel removes the points it earned and returns any it used, automatically.</p></div>');
}

function owner() {
  return '<div class="oa"><div class="oah"><div><div class="muted" style="font-size:12px">Friday, 31 October</div><h3>K-Beauty Bliss</h3></div><span class="ptschip">⟳</span></div>' +
    '<div class="oaher"><div style="opacity:.8;font-size:13px">Today</div><div style="font-size:34px;font-weight:800">AED 1,766</div><div style="opacity:.85;font-size:13px">5 paid orders</div></div>' +
    '<div class="oacard">' + [['🛒', 'Cart tracking', 'Live carts and where shoppers left'], ['🎁', 'Free gifts', 'Ranges, gift products and the mode'], ['📈', 'Gift box clicks', 'View all, Gifts Criteria, ranges, photos'], ['⭐', 'Points & credit <span class="tag2">new</span>', '201,640 points · AED 1,270 credit out']].map((r) => '<div class="oarow"><span class="ico">' + r[0] + '</span><div><b>' + r[1] + '</b><small>' + r[2] + '</small></div><span class="chev">›</span></div>').join('') + '</div>' +
    '<div class="oacard" style="padding:14px"><b>Bliss Points</b><div class="row" style="margin:10px 0;gap:8px"><div class="card" style="flex:1;padding:10px"><small class="muted">Earned today</small><div style="font-weight:800;font-size:18px">+3,410</div></div><div class="card" style="flex:1;padding:10px"><small class="muted">Used today</small><div style="font-weight:800;font-size:18px">−1,200</div></div></div><div class="muted" style="font-size:12.5px">Mode, rates, a customer’s points and store credit (add with an internal note) — the same controls as the console, with the PIN for Off / Testing / Live.</div></div></div>';
}

const VIEWS = { product, cart, checkout, thanks, account, transfer, email, admin: adminPoints, customer: adminCustomer, owner };
function render() {
  $('#scrBtns').innerHTML = SCREENS.map((s) => '<button data-scr="' + s[0] + '" aria-pressed="' + (S.scr === s[0]) + '">' + s[1] + '</button>').join('');
  document.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.view)));
  $('#frame').className = 'frame' + (S.view === 'phone' ? ' phone' : '');
  $('#app').innerHTML = '<div class="shop">' + VIEWS[S.scr]() + '</div>';
  try { location.hash = S.scr === 'product' ? '' : S.scr; } catch (e) {}
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,a,[data-go]');
  if (!t) return;
  const d = t.dataset;
  if (d.scr) { S.scr = d.scr; render(); window.scrollTo(0, 0); return; }
  if (d.v) { S.view = d.v; render(); return; }
  if (d.go) { S.scr = d.go; render(); window.scrollTo(0, 0); return; }
  if (d.atab) { S.aTab = d.atab; render(); return; }
  if (d.mode) { S.mode = d.mode; render(); toast('Bliss Points: ' + t.textContent); return; }
  if (d.pts) { S.usePts = +d.pts; render(); return; }
  if (d.amt) { S.tAmt = +d.amt; S.tErr = ''; render(); return; }
  const a = d.act;
  if (a === 'use') { S.use = !S.use; S.usePts = S.use ? redeemable() : 0; render(); }
  if (a === 'find') { const v = ($('#tTo') || {}).value || ''; S.tTo = v; if (/^\S+@\S+\.\S+$/.test(v) || /^0?5\d{8}$/.test(v.replace(/\s/g, ''))) { if (/layla/i.test(v)) { S.tFound = null; S.tErr = 'That’s your own account.'; } else { S.tFound = 'M••••• A.'; S.tErr = ''; } } else { S.tFound = null; S.tErr = 'Enter an email or a UAE mobile number.'; } render(); }
  if (a === 'next1') { S.tStep = 2; render(); }
  if (a === 'next2') { const v = parseInt(($('#tAmt') || {}).value, 10) || 0; S.tAmt = v; if (v < S.tMin) S.tErr = 'Send at least ' + S.tMin + ' points.'; else if (v > S.balance) S.tErr = 'You have ' + fmt(S.balance) + ' points.'; else if (v > S.tMaxDay) S.tErr = 'Up to ' + fmt(S.tMaxDay) + ' a day.'; else { S.tErr = ''; S.tStep = 3; } render(); }
  if (a === 'send') { S.balance -= S.tAmt; S.tStep = 4; render(); }
  if (a === 'again') { S.tStep = 1; S.tFound = null; S.tTo = ''; S.scr = 'account'; render(); }
  if (a === 'credit') { S.useCredit = !S.useCredit; render(); }
  if (a === 'cradd' || a === 'crrem') { const v = parseInt(($('#cr') || {}).value, 10) || 0; S.credit = Math.max(0, S.credit + (a === 'cradd' ? v : -v)); render(); toast((a === 'cradd' ? 'Added AED ' : 'Removed AED ') + v + ' store credit'); }
  if (a === 'adj' || a === 'adjm') { const v = parseInt(($('#adj') || {}).value, 10) || 0; S.balance = Math.max(0, S.balance + (a === 'adj' ? v : -v)); render(); toast((a === 'adj' ? 'Added ' : 'Removed ') + v + ' points'); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.act === 'slide') { S.usePts = +t.value; const p = t.closest('.card'); render(); const r = document.querySelector('.range'); if (r) r.focus(); }
  if (t.dataset.set) {
    const k = t.dataset.set; let v = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'otp') v = v === '1';
    else if (k !== 'award' && k !== 'transfers' && k !== 'creditOn') v = Math.max(0, parseFloat(v) || 0);
    if (k === 'value' && v <= 0) return;
    if (k === 'earnPer' && v <= 0) return;
    S[k] = v;
    const calc = document.querySelector('.calc');
    if (calc) calc.innerHTML = '<span>A AED 250 order earns <b>' + fmt(earnFor(250)) + ' points</b>, worth <b>' + aed(worth(earnFor(250))) + '</b> — a <b>' + (Math.round(S.earnPer * S.value * 1000) / 10) + '%</b> reward.</span><span class="muted">' + fmt(1 / S.value) + ' points = AED 1 off.</span>';
  }
});
document.addEventListener('change', (e) => { if (e.target.dataset.set) render(); });
const h = (location.hash || '').slice(1);
if (VIEWS[h]) S.scr = h;
render();
</script>
</body>
