<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift box previews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<!--
  Lane GBX -- LIVE PREVIEW of the free-gift box (built by tools/gbx-live-build.cjs).
  The boxes are the shop's own markup and CSS, rendered by partials.free-gifts.box
  from the owner's six live bands; the popups, the Gifts Criteria button and the
  glow come from tools/gbx-kit.{js,css}. Open this file in a browser and play.
-->
<style>
:root{--ink:#221A20;--muted:#756C74;--pink:#C6395F;--line:#ece4e8;--bg:#f7f3f5;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
[dir=rtl] body,[lang=ar] body{font-family:'Cairo','Outfit',system-ui,sans-serif}

/* ── the control page ── */
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp>span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--ink);padding:6px 11px;cursor:pointer;min-height:32px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg button:focus-visible,.bar select:focus-visible{outline:2px solid var(--pink);outline-offset:1px}
.bar select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;min-height:32px;background:#fff}
.hint{font-size:12px;color:var(--muted);padding:8px 16px 0;margin:0}
.stagewrap{padding:16px;overflow-x:auto}
.frame{box-sizing:content-box;display:block;margin:0 auto;border:1px solid #ddd2d8;background:#fff;box-shadow:0 10px 40px rgba(34,26,32,.12)}
.frame.phone{width:390px;height:844px;border-radius:36px;border:10px solid #221A20}
.frame.desk{width:1280px;height:820px;border-radius:12px}

/* ── the stage (inside the frame) ── */
.st{padding:20px 16px 40px;display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.st section{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 18px}
.st h2{font-size:12px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.st .line{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.st .line i{width:48px;height:48px;border-radius:10px;background:#f4e6ec;flex:none}
.st .line b{font-weight:600;font-size:14px;flex:1}
.st .line em{font-style:normal;font-weight:700;color:var(--pink)}
.st .tot{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.st .tot.big{font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.st .btn{display:block;text-align:center;background:var(--pink);color:#fff;border-radius:999px;padding:12px;font-weight:700;margin-top:12px}
@media (min-width:900px){.st{padding:32px}}

/* Lane GBX -- PREVIEW ONLY (see tools/gbx-kit.js). Plain values, no var()
   beside a newer CSS function, nothing that measures. */

/* ── The box: View all on the left, Gifts Criteria on the right ─────────── */
.gbx-ft{grid-column:1/-1;flex-basis:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.fgb .gbx-ft .fgb-tg{flex:0 1 auto;margin:0;min-height:32px}
.fgb .gbx-cr{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(46,143,98,.35);background:#f3faf6;color:#2e8f62;font:inherit;font-size:11.5px;font-weight:700;border-radius:999px;padding:0 11px;min-height:28px;cursor:pointer;white-space:nowrap}
.fgb .gbx-cr svg{width:13px;height:13px;flex:none}
.gbx-cr:focus-visible,.fgb-th .fgb-t[role=button]:focus-visible{outline:2px solid #C6395F;outline-offset:2px}
.fgb-th .fgb-t[role=button]{cursor:pointer}

/* ── Shared dialog frame: centred card on a computer, sheet on a phone ─── */
.gbx-d{position:fixed;inset:0;margin:auto;height:fit-content;border:0;padding:0;color:#221A20;background:#fff;font:inherit;max-width:none;max-height:none;overflow:visible}
.gbx-d::backdrop{background:rgba(34,26,32,.45)}
.gbx-d .gbx-x{position:absolute;top:10px;inset-inline-end:10px;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#221A20;cursor:pointer;z-index:2}
.gbx-d .gbx-x:focus-visible{outline:2px solid rgba(198,57,95,.45);outline-offset:1px}
.gbx-d small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#756C74}
.gbx-d h3{margin:3px 0 6px;font-size:16px;line-height:1.3;font-weight:700}
.gbx-pr{margin:0;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gbx-pr s{color:#756C74;font-size:13px}
.gbx-pr b{color:#C13E63}
.gbx-im{display:block;object-fit:contain;background:#FBF5F3}

/* A -- compact card: sheet from the bottom on a phone, centred on a computer */
.gbx-pA{width:min(400px,calc(100vw - 32px));border-radius:16px;box-shadow:0 18px 50px rgba(34,26,32,.22)}
.gbx-a{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;padding:18px 18px 18px;align-items:center}
.gbx-a .gbx-im{width:112px;height:112px;border-radius:12px}
.gbx-a .gbx-tx{padding-inline-end:24px;min-width:0}
.gbx-tag{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:11.5px;font-weight:700;color:#2e8f62;background:#f3faf6;border-radius:999px;padding:5px 10px}
@media (max-width:600px){
  .gbx-pA{width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .gbx-pA::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#e3d9de;margin:8px auto 0}
}

/* B -- photo on top, pink FREE badge */
.gbx-pB{width:min(340px,calc(100vw - 48px));border-radius:20px;overflow:hidden;box-shadow:0 22px 60px rgba(34,26,32,.25)}
.gbx-b-ph{position:relative;margin:0;background:#fff;border-bottom:1px solid #f6e6ec}
.gbx-b-ph .gbx-im{width:100%;height:auto;aspect-ratio:1;background:none;padding:22px;box-sizing:border-box}
.gbx-badge{position:absolute;top:14px;inset-inline-start:14px;background:#C6395F;color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;padding:6px 12px;border-radius:999px;box-shadow:0 6px 16px rgba(198,57,95,.35)}
.gbx-b-tx{padding:16px 20px 20px;text-align:center}
.gbx-b-tx .gbx-pr{justify-content:center}
.gbx-note{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 0;padding-top:12px;border-top:1px dashed #f0d5de;font-size:12.5px;font-weight:700;color:#C6395F}

/* D -- minimal luxe: thin type, champagne rule, value struck then FREE */
.gbx-pD{width:min(360px,calc(100vw - 48px));border-radius:4px;box-shadow:0 24px 70px rgba(34,26,32,.3)}
.gbx-dd{padding:34px 28px 26px;text-align:center}
.gbx-dd .gbx-im{width:180px;height:180px;margin:0 auto 18px;background:none}
.gbx-dd small{letter-spacing:.22em;font-weight:600;color:#9b8a6e}
.gbx-dd h3{font-size:17px;font-weight:500;letter-spacing:.01em;margin:8px 0 12px}
.gbx-dd .gbx-pr{justify-content:center;font-size:13px}
.gbx-vl{color:#756C74;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.gbx-fr{color:#221A20!important;letter-spacing:.18em;font-weight:800}
.gbx-dl{margin:16px auto 0;padding-top:14px;border-top:1px solid #e6d8c2;max-width:220px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9b8a6e}
.gbx-pD .gbx-x{background:none}

/* C -- the card inside the box, pointer at the photo tapped (calc only) */
.gbx-c{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;margin:10px 0 4px;padding:10px 40px 10px 10px;border:1px solid #f0d5de;border-radius:12px;background:#FFF8FA;box-shadow:0 6px 18px rgba(198,57,95,.10)}
[dir=rtl] .gbx-c{padding:10px 10px 10px 40px}
.gbx-c .gbx-im{width:64px;height:64px;border-radius:9px;background:#fff}
.gbx-c small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#756C74}
.gbx-c .gbx-nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.3;margin:1px 0 3px}
.gbx-c .gbx-pr{font-size:13px;gap:6px}
.gbx-c .gbx-pr s{font-size:11.5px;color:#756C74}
.gbx-c .gbx-pr b{color:#C13E63}
.gbx-c-fr{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:#2e8f62;border-radius:999px;padding:4px 8px}
.gbx-c .gbx-x{position:absolute;top:6px;inset-inline-end:6px;width:30px;height:30px;display:grid;place-items:center;border:0;background:none;color:#756C74;cursor:pointer;border-radius:50%}
.gbx-c .gbx-x:focus-visible{outline:2px solid rgba(198,57,95,.45)}
.gbx-c-ar{position:absolute;top:-7px;width:12px;height:12px;background:#FFF8FA;border-top:1px solid #f0d5de;border-left:1px solid #f0d5de;transform:rotate(45deg);inset-inline-start:calc(18px + var(--gi,0) * 48px)}
[dir=rtl] .gbx-c-ar{transform:rotate(45deg) scaleX(-1)}
.gbx-c[style*="--gc: 5"] .gbx-c-ar{inset-inline-start:calc((var(--gi,0) + .5) * 20% - 6px)}
.gbx-c[style*="--gc: 4"] .gbx-c-ar{inset-inline-start:calc((var(--gi,0) + .5) * 25% - 6px)}

/* ── Gifts Criteria: shared frame ───────────────────────────────────────── */
.gbx-crit{width:min(560px,calc(100vw - 48px));max-height:min(80vh,720px);border-radius:18px;box-shadow:0 22px 60px rgba(34,26,32,.25);flex-direction:column;overflow:hidden}
/* display only while open: a class rule must never override the closed dialog's display:none */
.gbx-crit[open]{display:flex}
.gbx-ch{position:relative;padding:18px 56px 12px 20px;border-bottom:1px solid #f1e8ec;background:linear-gradient(180deg,#FFF0F4,#fff)}
[dir=rtl] .gbx-ch{padding:18px 20px 12px 56px}
.gbx-ch h3{display:flex;align-items:center;gap:8px;margin:0;font-size:18px;color:#221A20}
.gbx-ch h3 svg{color:#2e8f62;width:18px;height:18px}
.gbx-ch p{margin:4px 0 0;font-size:13px;color:#756C74}
.gbx-cb{overflow:auto;overscroll-behavior:contain;padding:14px 16px 18px}
.gbx-t{position:relative;display:inline-block;width:40px;height:40px;border-radius:9px;background:#fff;border:1px solid rgba(42,34,40,.1);flex:none}
.gbx-t img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
.gbx-t b{position:absolute;top:-6px;inset-inline-end:-6px;background:#2e8f62;color:#fff;font-size:9.5px;line-height:1;padding:3px 4px;border-radius:999px}
.gbx-more{font-size:12px;font-weight:700;color:#756C74;align-self:center}
.gbx-am{font-weight:800;color:#2e8f62;white-space:nowrap}
.gbx-cn{font-size:12px;color:#756C74;white-space:nowrap}
.gbx-you{font-size:11px;font-weight:800;color:#fff;background:#C6395F;border-radius:999px;padding:3px 9px;white-space:nowrap}
@media (max-width:600px){
  .gbx-crit{width:100vw;max-height:85vh;margin:auto 0 0;border-radius:18px 18px 0 0}
}

/* 1 -- stacked tier cards */
.gbx-1{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.gbx-1 li{border:1px solid #ece4e8;border-radius:14px;padding:12px 14px;background:#fff}
.gbx-1 li.on{border-color:#C6395F;box-shadow:0 0 0 3px #FFF0F4;background:#FFFBFC}
.gbx-1h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gbx-1 .gbx-am{font-size:15px}
.gbx-1 .gbx-wd{margin:4px 0 9px;font-size:14px;font-weight:600}
.gbx-1 .gbx-th{display:flex;gap:7px;flex-wrap:wrap;padding-top:4px}

/* 2 -- compact ladder */
.gbx-2{list-style:none;margin:0;padding:0;position:relative}
.gbx-2::before{content:"";position:absolute;top:18px;bottom:18px;inset-inline-start:13px;width:2px;background:#e6efe9}
.gbx-2 li{position:relative;display:grid;grid-template-columns:28px 128px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed #efe6ea}
.gbx-2 li:last-child{border-bottom:0}
.gbx-dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:#fff;border:2px solid #cfe3d7;color:#2e8f62;box-sizing:border-box}
.gbx-2 li.done .gbx-dot{background:#e6f3ec}
.gbx-2 li.on .gbx-dot{background:#C6395F;border-color:#C6395F;color:#fff;box-shadow:0 0 0 4px #FFF0F4}
.gbx-2 .gbx-am{font-size:13.5px}
.gbx-2 .gbx-wd{font-size:13.5px;line-height:1.35}
.gbx-2 .gbx-wd em{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;background:#C6395F;border-radius:999px;padding:2px 7px;white-space:nowrap}
.gbx-2 li.on{background:linear-gradient(90deg,#FFF5F8,rgba(255,245,248,0))}
@media (max-width:600px){
  .gbx-2 li{grid-template-columns:28px minmax(0,1fr) auto;row-gap:2px}
  .gbx-2 .gbx-am{grid-column:2}
  .gbx-2 .gbx-wd{grid-column:2/4;grid-row:2}
  .gbx-2 .gbx-cn{grid-column:3;grid-row:1}
}

/* 3 -- step tabs */
.gbx-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.gbx-tabs::-webkit-scrollbar{display:none}
.gbx-tabs [role=tab]{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid #e3d9de;background:#fff;color:#221A20;font:inherit;font-size:12.5px;font-weight:700;border-radius:12px;padding:8px 12px;cursor:pointer;min-height:44px;justify-content:center}
.gbx-tabs [role=tab] i{font-style:normal;font-size:9.5px;font-weight:800;color:#C6395F;letter-spacing:.04em}
.gbx-tabs [role=tab][aria-selected=true]{background:#2e8f62;border-color:#2e8f62;color:#fff}
.gbx-tabs [role=tab][aria-selected=true] i{color:#fff}
.gbx-tabs [role=tab]:focus-visible{outline:2px solid #C6395F;outline-offset:2px}
.gbx-tp .gbx-wd{margin:4px 2px 12px;font-size:14.5px;font-weight:700}
.gbx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gbx-gc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.gbx-gc .gbx-t{width:72px;height:72px;border-radius:12px}
.gbx-gn{font-size:11.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:600px){.gbx-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ── Photo glow, G1 - G4 (box photos, list photos, homepage row photos) ── */
html[data-gbx-glow=G1] :is(.fgb-t,.fgh-p .fgh-t){box-shadow:0 0 0 2px #fff,0 0 10px rgba(198,57,95,.28)}
html[data-gbx-glow=G2] :is(.fgb-t,.fgh-p .fgh-t){border-color:rgba(198,57,95,.55);box-shadow:0 0 8px rgba(198,57,95,.22)}
html[data-gbx-glow=G3] :is(.fgb-t,.fgh-p .fgh-t){box-shadow:inset 0 0 0 2px #fff,0 0 0 1px rgba(198,57,95,.18),0 0 12px rgba(240,160,185,.5)}
html[data-gbx-glow=G4] :is(.fgb-t,.fgh-p .fgh-t){box-shadow:0 0 7px rgba(198,57,95,.18),0 0 15px rgba(214,181,140,.32)}

</style>
</head>
<body>

<script>
(function () {
  var q = new URLSearchParams(location.search), STAGE = q.has('stage'), D = window.GBX_DATA;
  var S = { pop: 'A', crit: '1', glow: 'G1', lang: 'en', width: 'phone', basket: 4 };
  try { Object.assign(S, JSON.parse(localStorage.getItem('gbx-live') || '{}')); } catch (e) {}

  if (STAGE) {
    // Inside the frame: the cart panel and the checkout summary, each with the real box.
    var money = function (aed, ar) { var n = aed.toLocaleString('en-US'); return ar ? n + ' د.إ' : 'AED ' + n; };
    var apply = function (s) {
      var ar = s.lang === 'ar', aed = D.baskets[s.basket];
      document.documentElement.lang = s.lang; document.documentElement.dir = ar ? 'rtl' : 'ltr';
      window.GBX_LANG = s.lang; window.GBX_OPT = { pop: s.pop, crit: s.crit };
      if (s.glow === 'none') delete document.documentElement.dataset.gbxGlow; else document.documentElement.dataset.gbxGlow = s.glow;
      var box = D[s.lang].boxes[s.basket], t = ar
        ? { cart: 'السلة', sum: 'ملخص الطلب', item: 'مجموعة العناية', sub: 'المجموع الفرعي', ship: 'التوصيل', free: 'مجاني', total: 'الإجمالي', go: 'إتمام الطلب' }
        : { cart: 'Cart panel', sum: 'Checkout · Order summary', item: 'Glow Ritual Set', sub: 'Subtotal', ship: 'Delivery', free: 'Free', total: 'Total', go: 'Checkout' };
      var line = '<div class="line"><i></i><b>' + t.item + '</b><em>' + money(aed, ar) + '</em></div>';
      document.getElementById('st').innerHTML =
        '<section><h2>' + t.cart + '</h2>' + line + box + '<div class="tot big"><span>' + t.sub + '</span><span>' + money(aed, ar) + '</span></div><span class="btn">' + t.go + '</span></section>' +
        '<section><h2>' + t.sum + '</h2>' + line + box + '<div class="tot"><span>' + t.sub + '</span><span>' + money(aed, ar) + '</span></div><div class="tot"><span>' + t.ship + '</span><span>' + t.free + '</span></div><div class="tot big"><span>' + t.total + '</span><span>' + money(aed, ar) + '</span></div></section>';
    };
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<main class="st" id="st"></main>';
      apply(S);
    });
    window.addEventListener('message', function (e) { if (e.data && e.data.gbx) { var open = document.querySelector('dialog[open]'); if (open) open.close(); apply(e.data.gbx); } });
    return;
  }

  // The control page.
  var ctl = [
    ['pop', 'Popup', [['A', 'A'], ['B', 'B'], ['C', 'C'], ['D', 'D']]],
    ['crit', 'Criteria', [['1', '1'], ['2', '2'], ['3', '3']]],
    ['glow', 'Glow', [['none', 'None'], ['G1', 'G1'], ['G2', 'G2'], ['G3', 'G3'], ['G4', 'G4']]],
    ['lang', 'Language', [['en', 'EN'], ['ar', 'AR']]],
    ['width', 'Width', [['phone', 'Phone 390'], ['desk', 'Desktop 1280']]],
  ];
  document.addEventListener('DOMContentLoaded', function () {
    var bar = '<div class="bar" role="toolbar" aria-label="Preview controls"><h1>Gift box previews</h1>' + ctl.map(function (c) {
      return '<div class="grp"><span>' + c[1] + '</span><div class="seg" data-k="' + c[0] + '">' + c[2].map(function (o) {
        return '<button type="button" data-v="' + o[0] + '" aria-pressed="false">' + o[1] + '</button>';
      }).join('') + '</div></div>';
    }).join('') + '<div class="grp"><span>Basket</span><select id="basket" aria-label="Basket total">' + D.en.crit.map(function (r, i) {
      return '<option value="' + i + '">AED ' + D.baskets[i].toLocaleString('en-US') + ' — ' + r.amount + '</option>';
    }).join('') + '</select></div></div>'
      + '<p class="hint">Tap a gift photo for its popup · “View all” opens the list · “Gifts Criteria” opens the bands · Esc, ✕ or a tap outside closes.</p>'
      + '<div class="stagewrap"><iframe class="frame" id="fr" title="Preview" src="' + location.pathname + '?stage"></iframe></div>';
    document.body.innerHTML = bar;
    var fr = document.getElementById('fr');
    var sync = function (send) {
      [].forEach.call(document.querySelectorAll('.seg'), function (seg) {
        [].forEach.call(seg.children, function (b) { b.setAttribute('aria-pressed', String(S[seg.dataset.k] === b.dataset.v)); });
      });
      document.getElementById('basket').value = S.basket;
      fr.className = 'frame ' + S.width;
      try { localStorage.setItem('gbx-live', JSON.stringify(S)); } catch (e) {}
      if (send && fr.contentWindow) fr.contentWindow.postMessage({ gbx: S }, '*');
    };
    document.querySelector('.bar').addEventListener('click', function (e) {
      var b = e.target.closest('.seg button'); if (!b) return;
      S[b.parentNode.dataset.k] = b.dataset.v; sync(true);
    });
    document.getElementById('basket').addEventListener('change', function (e) { S.basket = Number(e.target.value); sync(true); });
    fr.addEventListener('load', function () { fr.contentWindow.postMessage({ gbx: S }, '*'); });
    sync(false);
  });
})();
</script>

/* Lane GBX -- PREVIEW ONLY, never shipped. Injected into the preview shop by
   tools/gbx-shots.cjs (addInitScript), so the owner can pick:
     - a thumbnail popup design  A / B / C / D   (html[data-gbx-pop])
     - a Gifts Criteria design   1 / 2 / 3       (html[data-gbx-crit])
     - a photo glow              G1 / G2 / G3 / G4 (html[data-gbx-glow])
   Everything it needs arrives inline as window.GBX_DATA (no request). No
   layout-measuring call anywhere: the C card's pointer is placed with calc()
   from the photo's index, never from a measured box. Popups are <dialog>
   (showModal: Escape, inert page, focus kept inside) and give focus back to
   the photo or button that opened them. RTL follows <html dir>. */
(function () {
  var D = window.GBX_DATA || {}, opt = function () { return window.GBX_OPT || {}; };
  var ar, L, T;
  // The language: GBX_LANG when the live preview page sets it, else the shop's /ar/ path.
  function setLang() {
  ar = window.GBX_LANG ? window.GBX_LANG === 'ar' : (location.pathname.indexOf('/ar/') === 0 || location.pathname === '/ar');
  L = ar ? D.ar || {} : D.en || {};
  T = ar
    ? { crit: 'شروط الهدايا', close: 'إغلاق', free: 'مجاناً', freeWith: 'مجاناً مع طلبك', yours: 'سلتك الآن', value: 'القيمة', spend: 'كلما تسوّقت أكثر، حصلت على هدايا أكثر', gifts: 'الهدايا' }
    : { crit: 'Gifts Criteria', close: 'Close', free: 'FREE', freeWith: 'FREE with your order', yours: 'Your basket', value: 'Value', spend: 'The more you shop, the more you get.', gifts: 'Gifts' };
  }
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var money = function (f) { var n = (f / 100).toFixed(2).replace(/\.00$/, ''); return ar ? n + ' د.إ' : 'AED ' + n; };
  var X = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var GIFT = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/></svg>';

  function img(g, w, cls) {
    return '<img class="' + (cls || '') + '" src="' + esc(g.img) + '"' + (g.srcset ? ' srcset="' + esc(g.srcset) + '" sizes="' + w + 'px"' : '') + ' alt="" width="' + w + '" height="' + w + '" decoding="async">';
  }
  function prices(g, mode) {
    var sale = g.now < g.reg;
    if (mode === 'free') return '<p class="gbx-pr"><span class="gbx-vl">' + T.value + '</span> <s>' + money(g.reg) + '</s> <b class="gbx-fr">' + T.free + '</b></p>';
    return '<p class="gbx-pr">' + (sale ? '<s>' + money(g.reg) + '</s> ' : '') + '<b>' + money(g.now) + '</b></p>';
  }

  /* ── one <dialog>, reused ─────────────────────────────────────────────── */
  var dlg, opener;
  function dialog(cls, html, label) {
    if (!dlg) {
      dlg = document.createElement('dialog');
      dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
      // Escape closes the popup only -- never the cart panel underneath it.
      dlg.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); dlg.close(); } });
      dlg.addEventListener('close', function () { if (opener) { opener.focus(); opener = null; } });
      document.body.appendChild(dlg);
    }
    dlg.className = 'gbx-d ' + cls;
    dlg.setAttribute('aria-label', label);
    dlg.innerHTML = html;
    dlg.querySelector('.gbx-x').addEventListener('click', function () { dlg.close(); });
    if (!dlg.open) dlg.showModal();
    dlg.querySelector('.gbx-x').focus();
  }

  /* ── THE GIFT POPUP ───────────────────────────────────────────────────── */
  function gift(name, tile, idx) {
    setLang();
    var g = (L.gifts || {})[name];
    if (!g) return;
    opener = tile;
    var d = opt().pop || 'A';
    if (d === 'C') return inline(g, tile, idx);
    var x = '<button type="button" class="gbx-x" aria-label="' + T.close + '">' + X + '</button>';
    var body;
    if (d === 'A') {
      body = '<div class="gbx-a">' + img(g, 112, 'gbx-im') + '<div class="gbx-tx"><small>' + esc(g.brand) + '</small><h3>' + esc(g.name) + '</h3>' + prices(g) + '<span class="gbx-tag">' + GIFT + T.freeWith + '</span></div></div>';
    } else if (d === 'B') {
      body = '<figure class="gbx-b-ph">' + img(g, 320, 'gbx-im') + '<span class="gbx-badge">' + T.free + '</span></figure><div class="gbx-b-tx"><small>' + esc(g.brand) + '</small><h3>' + esc(g.name) + '</h3>' + prices(g) + '<p class="gbx-note">' + GIFT + T.freeWith + '</p></div>';
    } else {
      body = '<div class="gbx-dd">' + img(g, 220, 'gbx-im') + '<small>' + esc(g.brand) + '</small><h3>' + esc(g.name) + '</h3>' + prices(g, 'free') + '<p class="gbx-dl">' + T.freeWith + '</p></div>';
    }
    dialog('gbx-pop gbx-p' + d, x + body, g.name);
  }

  /* C: a card inside the box, under the photo row, its pointer at the photo
     that was tapped (calc from the index -- nothing is measured). */
  function inline(g, tile, idx) {
    var box = tile.closest('.fgb'), th = box.querySelector('.fgb-th'), old = box.querySelector('.gbx-c');
    if (old) { var same = old.getAttribute('data-i') === String(idx); old.remove(); if (same) { tile.focus(); return; } }
    var cols = box.classList.contains('fgb-g5') ? 5 : box.classList.contains('fgb-g4') ? 4 : 0;
    var c = document.createElement('div');
    c.className = 'gbx-c';
    c.setAttribute('role', 'dialog');
    c.setAttribute('aria-label', g.name);
    c.setAttribute('data-i', idx);
    c.style.setProperty('--gi', cols ? idx % cols : idx);
    c.style.setProperty('--gc', cols || 0);
    c.innerHTML = '<span class="gbx-c-ar" aria-hidden="true"></span>' + img(g, 64, 'gbx-im') + '<div class="gbx-tx"><small>' + esc(g.brand) + '</small><b class="gbx-nm">' + esc(g.name) + '</b>' + prices(g) + '</div><span class="gbx-c-fr">' + T.free + '</span><button type="button" class="gbx-x" aria-label="' + T.close + '">' + X + '</button>';
    th.insertAdjacentElement('afterend', c);
    var close = function () { c.remove(); tile.focus(); };
    c.querySelector('.gbx-x').addEventListener('click', close);
    c.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } });
    c.querySelector('.gbx-x').focus();
  }

  /* ── THE GIFTS CRITERIA POPUP ─────────────────────────────────────────── */
  function criteria(btn) {
    setLang();
    opener = btn;
    var rows = L.crit || [], d = opt().crit || '1';
    var words = (btn.closest('.fgb').querySelector('.fgb-w') || {}).textContent || '';
    var cur = -1;
    rows.forEach(function (r, i) { if (words.indexOf(r.words) === 0) cur = i; });
    var head = '<header class="gbx-ch"><h3>' + GIFT + T.crit + '</h3><p>' + T.spend + '</p><button type="button" class="gbx-x" aria-label="' + T.close + '">' + X + '</button></header>';
    var thumbs = function (r, n) {
      return r.thumbs.slice(0, n).map(function (t) { return '<span class="gbx-t">' + img(t, 40) + (t.q > 1 ? '<b>×' + t.q + '</b>' : '') + '</span>'; }).join('')
        + (r.thumbs.length > n ? '<span class="gbx-more">+' + (r.thumbs.length - n) + '</span>' : '');
    };
    var body = '';
    if (d === '1') {
      body = '<ol class="gbx-1">' + rows.map(function (r, i) {
        return '<li class="' + (i === cur ? 'on' : '') + '"><div class="gbx-1h"><span class="gbx-am">' + esc(r.amount) + '</span>' + (i === cur ? '<span class="gbx-you">' + T.yours + '</span>' : '<span class="gbx-cn">' + esc(r.count) + '</span>') + '</div><p class="gbx-wd">' + esc(r.words) + '</p><div class="gbx-th">' + thumbs(r, 6) + '</div></li>';
      }).join('') + '</ol>';
    } else if (d === '2') {
      body = '<ol class="gbx-2">' + rows.map(function (r, i) {
        return '<li class="' + (i === cur ? 'on' : (i < cur ? 'done' : '')) + '"><span class="gbx-dot" aria-hidden="true">' + (i + 1) + '</span><span class="gbx-am">' + esc(r.amount) + '</span><span class="gbx-wd">' + esc(r.words) + (i === cur ? ' <em>' + T.yours + '</em>' : '') + '</span><span class="gbx-cn">' + esc(r.count) + '</span></li>';
      }).join('') + '</ol>';
    } else {
      var sel = cur < 0 ? 0 : cur;
      body = '<div class="gbx-3"><div class="gbx-tabs" role="tablist">' + rows.map(function (r, i) {
        return '<button type="button" role="tab" id="gbx-tab' + i + '" aria-controls="gbx-tp" aria-selected="' + (i === sel) + '" tabindex="' + (i === sel ? 0 : -1) + '">' + esc(r.amount) + (i === cur ? '<i>' + T.yours + '</i>' : '') + '</button>';
      }).join('') + '</div><div class="gbx-tp" id="gbx-tp" role="tabpanel"></div></div>';
    }
    dialog('gbx-crit gbx-c' + d, head + '<div class="gbx-cb">' + body + '</div>', T.crit);
    if (d === '3') {
      var tabs = [].slice.call(dlg.querySelectorAll('[role=tab]')), tp = dlg.querySelector('.gbx-tp');
      var show = function (i, focus) {
        tabs.forEach(function (b, j) { b.setAttribute('aria-selected', j === i); b.tabIndex = j === i ? 0 : -1; });
        var r = rows[i];
        tp.setAttribute('aria-labelledby', 'gbx-tab' + i);
        tp.innerHTML = '<p class="gbx-wd">' + esc(r.words) + ' <span class="gbx-cn">· ' + esc(r.count) + '</span></p><div class="gbx-grid">' + r.thumbs.map(function (t) {
          return '<div class="gbx-gc"><span class="gbx-t">' + img(t, 72) + (t.q > 1 ? '<b>×' + t.q + '</b>' : '') + '</span><span class="gbx-gn">' + esc(t.name) + '</span></div>';
        }).join('') + '</div>';
        if (focus) tabs[i].focus();
      };
      tabs.forEach(function (b, i) {
        b.addEventListener('click', function () { show(i); });
        b.addEventListener('keydown', function (e) {
          var k = e.key, n = tabs.length, rtl = document.documentElement.dir === 'rtl';
          if (k === 'ArrowRight' || k === 'ArrowLeft') { e.preventDefault(); show((i + ((k === 'ArrowRight') !== rtl ? 1 : -1) + n) % n, true); }
        });
      });
      show(sel);
    }
  }

  /* ── wiring the real box: photos become buttons, the new button sits on
     the right of View all (and of Hide, so it is there with the list open). */
  function wire() {
    setLang();
    [].forEach.call(document.querySelectorAll('.fgb'), function (box) {
      if (box.getAttribute('data-gbx')) return;
      box.setAttribute('data-gbx', '1');
      [].forEach.call(box.querySelectorAll('.fgb-th .fgb-t'), function (t, i) {
        var im = t.querySelector('img'), name = im ? im.getAttribute('alt') : '';
        t.setAttribute('role', 'button');
        t.setAttribute('tabindex', '0');
        t.setAttribute('aria-haspopup', 'dialog');
        t.setAttribute('aria-label', name);
        t.addEventListener('click', function () { gift(name, t, i); });
        t.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); gift(name, t, i); } });
      });
      [].forEach.call(box.querySelectorAll('.fgb-tg'), function (tg) {
        var ft = document.createElement('div'); ft.className = 'gbx-ft';
        tg.parentNode.insertBefore(ft, tg); ft.appendChild(tg);
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'gbx-cr'; b.setAttribute('aria-haspopup', 'dialog');
        b.innerHTML = GIFT + '<span>' + T.crit + '</span>';
        b.addEventListener('click', function () { criteria(b); });
        ft.appendChild(b);
      });
    });
  }
  window.GBX = { wire: wire, gift: gift, criteria: criteria };
  if (window.GBX_DATA) {
    var go = function () { wire(); new MutationObserver(wire).observe(document.body, { childList: true, subtree: true }); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  }
})();

</script>
</body>
</html>
