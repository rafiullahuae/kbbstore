<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Bag Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=Cairo:wght@400..800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Outfit;src:url(../../../resources/fonts/outfit/outfit-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Cairo;src:url(../../../resources/fonts/cairo/cairo-arabic.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF}
:root{--pk:#C13E63;--pk2:#E0567B;--ink:#2A2228;--ink2:#5E545A;--mut:#8C828A;--line:#EFE4E8;--grey:#F3EEF0;--greyi:#9A8F95}
*{box-sizing:border-box}
body{margin:0;background:#F4EFEC;font-family:Outfit,Cairo,sans-serif;color:var(--ink)}
.top{max-width:1240px;margin:0 auto;padding:22px 16px 6px}
.top h1{font-size:22px;margin:0 0 4px}.top p{margin:0;color:var(--ink2);font-size:14px;line-height:1.5}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.ctl button{font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:10px 16px;border:1.5px solid var(--pk);background:#fff;color:var(--pk);cursor:pointer}
.ctl button.solid{background:var(--pk);color:#fff}
.ctl .seg{display:inline-flex;border:1.5px solid #D9CCD2;border-radius:999px;overflow:hidden}
.ctl .seg button{border:0;border-radius:0;background:#fff;color:var(--ink2)}.ctl .seg button.on{background:var(--ink);color:#fff}
.row{max-width:1240px;margin:0 auto;padding:10px 16px 40px;display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.opt{flex:0 0 auto}
.opt h2{font-size:15px;margin:0 0 4px}.opt .d{font-size:12.5px;color:var(--ink2);max-width:360px;margin:0 0 10px;line-height:1.45}

/* phone */
.ph{width:360px;height:740px;border-radius:46px;background:#111;padding:10px;box-shadow:0 20px 50px rgba(42,34,40,.18)}
.sc{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:#fff}
.hd{display:flex;align-items:center;gap:10px;padding:38px 14px 8px}
.hd .ic{width:24px;height:24px;flex:none}
.hd .logo{height:30px;flex:1 1 auto;min-width:0;object-fit:contain;object-position:left}
[dir=rtl] .hd .logo{object-position:right}
[dir=rtl] .hero img{left:38%}
.cap{flex:none;font-size:11px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px;font-family:Cairo,Outfit}
.hbtn{position:relative;flex:none;width:28px;height:28px;display:grid;place-items:center}
.hbtn .b{position:absolute;top:-5px;inset-inline-end:-6px;min-width:17px;height:17px;border-radius:9px;background:var(--pk);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sr{margin:4px 14px 0;height:38px;border:1px solid var(--line);border-radius:12px;background:#FBF8F9;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;color:var(--mut)}
.strip{margin-top:8px;background:#E8A6BA;color:#fff;font-size:11.5px;font-weight:600;text-align:center;padding:6px}
.hero{height:330px;background:radial-gradient(circle at 70% 70%,#BFEDE7 0 90px,transparent 91px),linear-gradient(180deg,#FFF0F4,#FCE6EC);position:relative}
.hero img{position:absolute;height:290px;left:62%;top:22px;transform:translateX(-50%) rotate(-8deg);filter:drop-shadow(0 16px 18px rgba(60,30,40,.18))}
.hero b{position:absolute;inset-inline-start:20px;top:28px;font-size:24px;line-height:1.15;max-width:150px}
.prod{display:flex;align-items:center;gap:12px;margin:12px 14px;padding:10px;border:1px solid var(--line);border-radius:14px}
.prod img{width:46px;height:60px;object-fit:contain}.prod .t{flex:1;font-size:12.5px;line-height:1.35}.prod .t small{display:block;color:var(--pk);font-weight:700;font-size:13px;margin-top:2px}
.prod button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:10px;background:var(--pk);color:#fff;padding:9px 12px;cursor:pointer}

/* bottom bar D, reworked: Home · Categories · raised Bag · Account · More */
.bar{position:absolute;left:0;right:0;bottom:0;height:92px;padding:26px 6px 22px;display:flex;
  background:radial-gradient(circle at 50% 33px,#fff 33px,transparent 34px),linear-gradient(transparent 22px,#fff 22px);
  filter:drop-shadow(0 -1px 0 var(--line))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--greyi);background:none;border:0;font-family:inherit;cursor:pointer;padding:0}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--pk);font-weight:700}
.tab.raised{position:relative;color:var(--greyi)}
.pill{position:relative;width:54px;height:54px;margin-top:-20px;border-radius:27px;display:grid;place-items:center;
  background:var(--grey);box-shadow:0 0 0 4px #fff,0 4px 10px rgba(42,34,40,.10);transition:background .45s,box-shadow .45s}
.full .pill{background:linear-gradient(160deg,var(--pk2),var(--pk));box-shadow:0 0 0 4px #fff,0 8px 18px rgba(193,62,99,.38)}
.full .tab.raised{color:var(--pk);font-weight:700}
.bdg{position:absolute;top:-5px;inset-inline-end:-6px;min-width:21px;height:21px;border-radius:11px;background:#fff;color:var(--pk);font-size:11.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 1.8px var(--pk);transform:scale(0);transition:transform .3s}
.full .bdg{transform:scale(1)}
.bump .bdg{animation:bdg .5s}
@keyframes bdg{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

/* the face, shared parts */
.tab .face{width:38px;height:38px;overflow:visible}
.face .st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.face{color:#8E838A;transition:color .4s}
.full .face{color:#fff}
.sad,.happy{transition:opacity .25s}
.happy{opacity:0}.full .happy{opacity:1}.full .sad{opacity:0}
.cheek{fill:#FFB3C6;opacity:0;transition:opacity .4s}.full .cheek{opacity:.9}

/* A · Little bag friend: droops and sighs when empty; hops, grins and sparkles when filled */
.A .face{transform-origin:50% 90%;animation:sigh 5s ease-in-out infinite}
@keyframes sigh{0%,70%,100%{transform:rotate(-6deg) translateY(1px)}80%{transform:rotate(-9deg) translateY(2.5px)}90%{transform:rotate(-5deg) translateY(1px)}}
.A.full .face{animation:glee 3.6s ease-in-out infinite}
@keyframes glee{0%,82%,100%{transform:rotate(0) translateY(0)}88%{transform:rotate(-7deg) translateY(-2px)}94%{transform:rotate(7deg) translateY(-2px)}}
.A.pop .pill{animation:popA .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes popA{0%{transform:scale(.7)}50%{transform:scale(1.18) translateY(-8px)}100%{transform:scale(1)}}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--pk2);left:50%;top:50%;opacity:0;pointer-events:none}
.pop .spark{animation:spark .75s ease-out}
.pop .spark:nth-child(2n){background:#FFC94A}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-44px) scale(.4)}}

/* B · Cart buddy: a little tear when empty; an item drops in, the cart bounces and beams */
.B .tear{fill:#9CC7E8;opacity:0;animation:tear 6s ease-in infinite}
.B.full .tear{display:none}
@keyframes tear{0%,60%{opacity:0;transform:translateY(0)}65%{opacity:1;transform:translateY(0)}85%{opacity:1;transform:translateY(5px)}90%,100%{opacity:0;transform:translateY(7px)}}
.B .drop{fill:#FFC94A;stroke:#fff;stroke-width:1;opacity:0}
.B.pop .drop{animation:drop .6s cubic-bezier(.5,0,.7,1)}
@keyframes drop{0%{opacity:1;transform:translateY(-26px) rotate(-20deg)}70%{opacity:1;transform:translateY(0) rotate(5deg)}100%{opacity:0;transform:translateY(2px)}}
.B.pop .pill{animation:popB .8s .45s ease-out}
@keyframes popB{0%{transform:translateY(0)}25%{transform:translateY(-9px) scale(1.08,.94)}50%{transform:translateY(0) scale(.96,1.06)}75%{transform:translateY(-3px)}100%{transform:none}}
.B .wheel{transform-box:fill-box;transform-origin:center}
.B.pop .wheel{animation:spin .6s .45s linear 2}
@keyframes spin{to{transform:rotate(360deg)}}
.heartup{position:absolute;left:50%;top:0;width:14px;height:14px;opacity:0;pointer-events:none;color:var(--pk2)}
.B.pop .heartup{animation:hup 1.1s .6s ease-out}
.B.pop .heartup.h2{animation-delay:.8s;left:30%}
@keyframes hup{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-38px) scale(1.1)}}

/* C · Glow & wink: calm grey when empty; a pink ripple, a wink and a heart when filled */
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--pk2);opacity:0;pointer-events:none}
.C.pop .ring{animation:ring .9s ease-out}
.C.pop .ring.r2{animation-delay:.25s}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.C.pop .pill{animation:popC .5s ease-out}
@keyframes popC{0%{transform:scale(.85)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.C .wink{transform-box:fill-box;transform-origin:center;animation:wink 4.5s infinite}
@keyframes wink{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.1)}}
.C:not(.full) .wink{animation:none}
.C.pop .heartup{animation:hup 1s .2s ease-out}

/* More sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(42,34,40,.18);padding:12px 18px 100px;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.more .sheet{transform:none}
.sheet .gr{width:40px;height:4px;border-radius:2px;background:#E2D7DC;margin:0 auto 12px}
.sheet a{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #F4ECEF;font-size:14.5px;color:var(--ink);text-decoration:none}
.sheet a svg{width:20px;height:20px;color:var(--pk)}
.dim{position:absolute;inset:0;background:rgba(42,34,40,.25);opacity:0;pointer-events:none;transition:opacity .3s}
.more .dim{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="top">
 <h1 id="ttl">Happy bag — live preview</h1>
 <p id="lead">The empty bag is plain grey with a little sad face. Add something and it turns pink and smiles, with its own animation. The header shows the wishlist where Account was. Tap <b>More</b> to open its sheet.</p>
 <div class="ctl">
  <button class="solid" id="add">+ Add to bag</button>
  <button id="empty">Empty the bag</button>
  <span class="seg"><button class="on" data-lang="en">English</button><button data-lang="ar">العربية</button></span>
 </div>
</div>
<div class="row" id="row"></div>

<template id="tpl">
 <div class="opt">
  <h2></h2><p class="d"></p>
  <div class="ph"><div class="sc">
   <div class="hd">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h16"/></svg>
    <img class="logo" alt="">
    <span class="cap"></span>
    <span class="hbtn" title="Wishlist"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7.2-4.5-9.1-8.7C1.5 8.2 3.6 5 7 5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.5 3.2 4.1 6.3C19.2 15.5 12 20 12 20z"/></svg><span class="b">2</span></span>
   </div>
   <div class="sr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C13E63" stroke-width="2.4" stroke-linecap="round"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm9 16-4-4"/></svg><span class="srt"></span></div>
   <div class="strip"></div>
   <div class="hero"><b class="ht"></b><img src="cut-mist.png" alt=""></div>
   <div class="prod"><img src="cut-mist.png" alt=""><div class="t"><span class="pn"></span><small>AED 85</small></div><button class="addone"></button></div>
   <div class="dim"></div>
   <div class="sheet"><div class="gr"></div><div class="links"></div></div>
   <nav class="bar"></nav>
  </div></div>
 </div>
</template>

<script>
const I = {
 home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
 cats:'M4 5h6v6H4zM14 5h6M14 9h4M4 15h6v4H4zM14 15h6M14 19h4',
 user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7.5 9a7.5 7.5 0 0 1 15 0',
 more:'M5 12h.01M12 12h.01M19 12h.01',
 heart:'M12 20s-7.2-4.5-9.1-8.7C1.5 8.2 3.6 5 7 5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.5 3.2 4.1 6.3C19.2 15.5 12 20 12 20z',
 box:'M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8', tag:'M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1 1 0 0 1 0 1.4l-7.3 7.3a1 1 0 0 1-1.4 0z',
 drop:'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z', book:'M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-7', chat:'M4 5h16v11H8l-4 4z', globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'
};
const svg = (d, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const T = {
 en: { dir:'ltr', logo:'logo-en.png', cap:'العربية', search:'Search skincare, brands…', strip:'1–3 Days Delivery all over UAE – Free Delivery over AED 199',
  hero:'Glass skin, in one mist', pn:'Anua PDRN Capsule Mist Mini', add:'Add', tabs:['Home','Categories','Bag','Account','More'],
  more:[['tag','Brands'],['heart','Wishlist'],['box','My orders'],['drop','Skin concerns'],['book','Blog'],['chat','Contact us'],['globe','Language & region']],
  ttl:'Happy bag — live preview', lead:'The empty bag is plain grey with a little sad face. Add something and it turns pink and smiles, with its own animation. The header shows the wishlist where Account was. Tap <b>More</b> to open its sheet.',
  addb:'+ Add to bag', emptyb:'Empty the bag',
  opts:[['A · Little bag friend','Empty: grey, droops and sighs now and then. Added: hops up, turns pink, grins with rosy cheeks and a burst of sparkles; does a happy wiggle every few seconds.'],
        ['B · Cart buddy','Empty: a grey cart that sheds a small tear now and then. Added: the item drops into the cart, it bounces on spinning wheels, beams, and two little hearts float up.'],
        ['C · Glow & wink','Empty: calm grey, a small flat face. Added: two pink ripples, the bag turns pink, smiles and winks every few seconds, and a heart pops up.']] },
 ar: { dir:'rtl', logo:'logo-ar.png', cap:'EN', search:'ابحثي عن منتجات العناية، الماركات…', strip:'توصيل خلال 1–3 أيام لجميع الإمارات – توصيل مجاني فوق 199 درهم',
  hero:'بشرة زجاجية برذاذ واحد', pn:'رذاذ أنوا PDRN ميني', add:'أضف', tabs:['الرئيسية','الأقسام','السلة','حسابي','المزيد'],
  more:[['tag','الماركات'],['heart','المفضلة'],['box','طلباتي'],['drop','مشاكل البشرة'],['book','المدونة'],['chat','تواصل معنا'],['globe','اللغة والمنطقة']],
  ttl:'السلة السعيدة — معاينة حية', lead:'السلة الفارغة رمادية بوجه حزين صغير. عند إضافة منتج تصبح وردية وتبتسم مع حركة خاصة بها. في الأعلى تظهر المفضلة مكان الحساب. اضغطي <b>المزيد</b> لفتح القائمة.',
  addb:'+ أضف إلى السلة', emptyb:'إفراغ السلة',
  opts:[['A · صديقة السلة','فارغة: رمادية، تتدلّى وتتنهّد أحياناً. عند الإضافة: تقفز وتصبح وردية وتبتسم بخدود وردية مع لمعات؛ وتهتز بفرح كل بضع ثوانٍ.'],
        ['B · رفيق العربة','فارغة: عربة رمادية تذرف دمعة صغيرة أحياناً. عند الإضافة: يسقط المنتج فيها، تقفز على عجلات تدور، تبتسم، ويطير قلبان صغيران.'],
        ['C · توهّج وغمزة','فارغة: رمادية هادئة بوجه بسيط. عند الإضافة: موجتان ورديتان، تصبح وردية، تبتسم وتغمز كل بضع ثوانٍ، ويظهر قلب.']] }
};
// The three faces. Mouths are two paths cross-faded (no path morphing: iPhone Safari cannot animate `d`).
const FACE = {
 A: `<svg class="face" viewBox="0 0 32 32"><path class="st" d="M7 11.5h18l-1.6 15a1.4 1.4 0 0 1-1.4 1.2H10a1.4 1.4 0 0 1-1.4-1.2zM12 11.5V9a4 4 0 0 1 8 0v2.5"/>
   <g class="sad"><path class="st" d="M11.4 17.3l2.6-.9M20.6 17.3l-2.6-.9" stroke-width="1.6"/><circle cx="13" cy="18.6" r="1.2" fill="currentColor"/><circle cx="19" cy="18.6" r="1.2" fill="currentColor"/><path class="st" d="M13.4 23.6c1.6-1.6 3.6-1.6 5.2 0" stroke-width="1.7"/></g>
   <g class="happy"><circle class="cheek" cx="11" cy="21.4" r="1.7"/><circle class="cheek" cx="21" cy="21.4" r="1.7"/><path class="st" d="M11.5 18.6c.7-1.3 2.3-1.3 3 0M17.5 18.6c.7-1.3 2.3-1.3 3 0" stroke-width="1.7"/><path class="st" d="M12.6 21.6c1.9 2.6 4.9 2.6 6.8 0" stroke-width="1.9"/></g></svg>`,
 B: `<svg class="face" viewBox="0 0 32 32"><rect class="drop" x="13" y="7" width="7" height="7" rx="1.5"/>
   <path class="st" d="M3.5 6h3.2l2.6 13.2a1.6 1.6 0 0 0 1.6 1.3h12.3a1.6 1.6 0 0 0 1.6-1.2L27.5 10H7.8"/>
   <circle class="st wheel" cx="12" cy="25.5" r="2"/><circle class="st wheel" cx="22.5" cy="25.5" r="2"/>
   <g class="sad"><circle cx="14" cy="13.6" r="1.1" fill="currentColor"/><circle cx="20.5" cy="13.6" r="1.1" fill="currentColor"/><path class="st" d="M14.6 18c1.3-1.2 3.3-1.2 4.6 0" stroke-width="1.6"/><path class="tear" d="M13.4 15.2s-1 1.4-1 2a1 1 0 0 0 2 0c0-.6-1-2-1-2z"/></g>
   <g class="happy"><circle class="cheek" cx="12.4" cy="16.2" r="1.4"/><circle class="cheek" cx="22.2" cy="16.2" r="1.4"/><path class="st" d="M12.9 14c.6-1.1 1.9-1.1 2.5 0M19.3 14c.6-1.1 1.9-1.1 2.5 0" stroke-width="1.6"/><path class="st" d="M14 16.4c1.8 2.3 4.8 2.3 6.6 0" stroke-width="1.8"/></g></svg>`,
 C: `<svg class="face" viewBox="0 0 32 32"><path class="st" d="M7 11.5h18l-1.6 15a1.4 1.4 0 0 1-1.4 1.2H10a1.4 1.4 0 0 1-1.4-1.2zM12 11.5V9a4 4 0 0 1 8 0v2.5"/>
   <g class="sad"><circle cx="13" cy="18.4" r="1.1" fill="currentColor"/><circle cx="19" cy="18.4" r="1.1" fill="currentColor"/><path class="st" d="M13.6 23.2c1.5-1 3.3-1 4.8 0" stroke-width="1.6"/></g>
   <g class="happy"><circle class="cheek" cx="11" cy="21.6" r="1.6"/><circle class="cheek" cx="21" cy="21.6" r="1.6"/><circle class="wink" cx="13" cy="18.4" r="1.3" fill="currentColor"/><path class="st" d="M17.6 18.6c.6-1.1 2.2-1.1 2.8 0" stroke-width="1.7"/><path class="st" d="M12.6 21.4c1.9 2.6 4.9 2.6 6.8 0" stroke-width="1.9"/></g></svg>`
};
let lang = 'en', count = 0;
const row = document.getElementById('row');
function draw(){
  const t = T[lang];
  document.documentElement.dir = t.dir; document.documentElement.lang = lang;
  document.getElementById('ttl').textContent = t.ttl; document.getElementById('lead').innerHTML = t.lead;
  document.getElementById('add').textContent = t.addb; document.getElementById('empty').textContent = t.emptyb;
  row.innerHTML = '';
  ['A','B','C'].forEach((k, i) => {
    const n = document.getElementById('tpl').content.cloneNode(true), o = n.querySelector('.opt'), sc = n.querySelector('.sc');
    o.querySelector('h2').textContent = t.opts[i][0]; o.querySelector('.d').textContent = t.opts[i][1];
    sc.classList.add(k); if (count) sc.classList.add('full');
    n.querySelector('.logo').src = t.logo; n.querySelector('.cap').textContent = t.cap; n.querySelector('.srt').textContent = t.search;
    n.querySelector('.strip').textContent = t.strip; n.querySelector('.ht').textContent = t.hero; n.querySelector('.pn').textContent = t.pn;
    n.querySelector('.addone').textContent = t.add;
    n.querySelector('.links').innerHTML = t.more.map(([ic, l]) => `<a href="#">${svg(I[ic])}${l}</a>`).join('');
    const sparks = k === 'A' ? [0,45,90,135,180,225,270,315].map(a => `<i class="spark" style="--a:${a}deg"></i>`).join('') : '';
    const extra = k === 'C' ? '<i class="ring"></i><i class="ring r2"></i>' : '';
    const hearts = k !== 'A' ? `<svg class="heartup" viewBox="0 0 24 24" fill="currentColor"><path d="${I.heart}"/></svg>` + (k === 'B' ? `<svg class="heartup h2" viewBox="0 0 24 24" fill="currentColor"><path d="${I.heart}"/></svg>` : '') : '';
    const tabs = t.tabs;
    n.querySelector('.bar').innerHTML =
      `<button class="tab on">${svg(I.home)}<span>${tabs[0]}</span></button>` +
      `<button class="tab">${svg(I.cats)}<span>${tabs[1]}</span></button>` +
      `<button class="tab raised" aria-label="${tabs[2]}"><span class="pill">${extra}${FACE[k]}${sparks}${hearts}<span class="bdg">${count}</span></span></button>` +
      `<button class="tab">${svg(I.user)}<span>${tabs[3]}</span></button>` +
      `<button class="tab tmore">${svg(I.more, 3.2)}<span>${tabs[4]}</span></button>`;
    n.querySelector('.tmore').onclick = () => sc.classList.toggle('more');
    n.querySelector('.dim').onclick = () => sc.classList.remove('more');
    n.querySelector('.addone').onclick = add;
    row.appendChild(n);
  });
}
function add(){
  count++;
  document.querySelectorAll('.sc').forEach(sc => {
    const first = !sc.classList.contains('full');
    sc.classList.add('full'); sc.querySelector('.bdg').textContent = count;
    sc.classList.remove('pop', 'bump'); void sc.offsetWidth;          // restart the animation
    sc.classList.add(first ? 'pop' : 'bump'); if (!first && sc.classList.contains('B')) sc.classList.add('pop');
  });
}
document.getElementById('add').onclick = add;
document.getElementById('empty').onclick = () => { count = 0; document.querySelectorAll('.sc').forEach(sc => sc.classList.remove('full', 'pop', 'bump')); };
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = b.dataset.lang; document.querySelectorAll('[data-lang]').forEach(x => x.classList.toggle('on', x === b)); draw();
});
draw();
</script>
</body></html>
