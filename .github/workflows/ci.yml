name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Matches the production host (PHP 8.3.x on Hostinger).
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, gd
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint every PHP file
        run: find app database routes tools -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # Written here rather than copied from env.staging.txt: that file sets
      # KBB_BASE_PATH=/kbb-upgrade, which prefixes every route, so the suite
      # would request paths the router does not serve.
      - name: Prepare environment
        run: |
          cat > .env <<'ENV'
          APP_NAME=KBB
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=database/testing.sqlite
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          ENV
          touch database/testing.sqlite
          php artisan key:generate --force

      - name: Tests
        run: vendor/bin/pest --compact

      # Advisory only: Laravel 11 carries three open advisories that need a 12.x
      # upgrade. Reported on every run so it cannot be forgotten, but it does not
      # block a PR that did not introduce it.
      - name: Dependency advisories
        run: composer audit --no-interaction || true
